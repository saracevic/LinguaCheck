<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro English Grammar Academy v2 — 12 Tenses with AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e3a8a;
            --primary-light: #dbeafe;
            --success: #059669;
            --error: #dc2626;
            --warning: #d97706;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --dark-green: #065f46;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.85;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-box {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.6px;
        }

        .tense-grid {
            display: grid;
            gap: 6px;
        }

        .tense-option {
            padding: 10px 12px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            font-weight: 600;
        }

        .tense-option:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .tense-option.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tense-name {
            display: block;
            margin-bottom: 1px;
        }

        .tense-code {
            font-size: 9px;
            opacity: 0.7;
            font-family: 'IBM Plex Mono', monospace;
        }

        .lesson-panel {
            background: var(--card);
            border-radius: 12px;
            padding: 35px;
        }

        .lesson-header {
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--border);
        }

        .tense-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .tense-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .rule-statement {
            background: linear-gradient(135deg, #dbeafe 0%, #f0f9ff 100%);
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
        }

        .timeline-container {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 25px;
            margin: 25px 0;
            text-align: center;
        }

        .timeline-svg {
            width: 100%;
            max-width: 600px;
            height: 200px;
            margin: 0 auto;
        }

        .collapsible-section {
            margin: 20px 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }

        .section-header:hover {
            background: #bfdbfe;
        }

        .section-title {
            flex: 1;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        .section-toggle {
            transition: transform 0.3s;
            font-size: 16px;
        }

        .section-toggle.open {
            transform: rotate(180deg);
        }

        .section-content {
            display: none;
            padding: 20px;
            background: var(--bg);
            border-radius: 8px;
            margin-top: 8px;
        }

        .section-content.open {
            display: block;
        }

        .practice-section {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 2px solid var(--warning);
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0;
        }

        .practice-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--warning);
            margin-bottom: 8px;
        }

        .practice-subtitle {
            font-size: 12px;
            color: #92400e;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .practice-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #fcd34d;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 10px 16px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .tab-btn:hover {
            color: var(--warning);
        }

        .tab-btn.active {
            color: var(--warning);
            border-bottom-color: var(--warning);
        }

        .tab-content {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .tab-content.active {
            display: block;
        }

        .step-label {
            font-weight: 700;
            color: var(--text);
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .step-desc {
            font-size: 12px;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .choice-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .choice-btn {
            padding: 12px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }

        .choice-btn:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .choice-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .english-display {
            background: var(--primary-light);
            padding: 14px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--primary);
            border-left: 4px solid var(--primary);
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text);
            background: white;
            min-height: 60px;
            resize: none;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: #1e40af;
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .feedback-box {
            display: none;
            border-radius: 10px;
            padding: 18px;
            margin-top: 18px;
            animation: slideIn 0.4s ease;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background: linear-gradient(135deg, #dcfce7 0%, #d1fae5 100%);
            border: 2px solid var(--success);
        }

        .feedback-box.incorrect {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border: 2px solid var(--error);
        }

        .feedback-header {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .feedback-box.correct .feedback-header {
            color: var(--success);
        }

        .feedback-box.incorrect .feedback-header {
            color: var(--error);
        }

        .feedback-content {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text);
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 15px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .choice-group {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🎓 Pro English Grammar Academy</div>
        <div class="tagline">12 Tenses • AI-Powered • Research-Based Learning</div>
    </header>

    <div class="stats-bar">
        <div class="stat-box">

        <div class="stat-box">

        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-streak">0</div>
            <div class="stat-label">🔥 Seri</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-accuracy">0%</div>
            <div class="stat-label">📊 Başarı</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="sidebar">
            <div class="sidebar-title">⏰ Tüm 12 Zaman</div>
            <div class="tense-grid" id="tense-grid"></div>
        </div>

        <div class="lesson-panel">
            <div id="lesson-content"></div>
        </div>
    </div>
</div>

// ════════════════════════════════════════════════════════════════════════

        rule: 'Geçmişte bir olaydan öncesi süredir devam eden eylemler.',
        formula: [
            { label: 'Olumlu', text: 'had + been + V-ing' },
            { label: 'Olumsuz', text: 'had + not + been + V-ing' },
            { label: 'Soru', text: 'Had + subject + been + V-ing?' }
        ],
        timelineType: 'past-perfect-continuous',
        timelineDesc: 'Geçmiş (═════→→) ═ Geçmiş ═ ŞİMDİ ═ Gelecek\nGeçmişte öncesinde devam eden (süre vurgulu)',
        examples: [
            { en: 'I had been working for 8 hours.', tr: '8 saattir çalışmaktaydım.' },
            { en: 'She had been waiting since morning.', tr: 'Sabahtan beri beklemekteydi.' },
            { en: 'They had been playing for 2 hours.', tr: '2 saat oynamakta idiler.' }
        ],
        commonMistakes: [
            { wrong: 'I had working', right: 'I had been working', explanation: 'had + been + V-ing' }
        ]
    },
    {
        id: 10,
        name: 'Future Perfect',
        code: 'will + have + PP',
        turkish: 'Gelecek Tamamlanmışı',
        rule: 'Gelecekte belirli zamana kadar tamamlanmış olacak eylemler.',
        formula: [
            { label: 'Olumlu', text: 'will + have + Past Participle' },
            { label: 'Olumsuz', text: 'will + have + not + PP' },
            { label: 'Soru', text: 'Will + subject + have + PP?' }
        ],
        timelineType: 'future-perfect',
        timelineDesc: 'Geçmiş ═════════════ ŞİMDİ ═════════════ Gelecek (X earlier) ═ Gelecek\nGelecekte tamamlanmış olacak',
        examples: [
            { en: 'I will have finished by Friday.', tr: 'Cuma günü bitirmiş olacağım.' },
            { en: 'She will have completed the course.', tr: 'Kursu bitirmiş olacak.' },
            { en: 'They will have arrived.', tr: 'Varmış olacaklar.' }
        ],
        commonMistakes: [
            { wrong: 'I will finish by Friday', right: 'I will have finished by Friday', explanation: 'by + zaman = Future Perfect' }
        ]
    },
    {
        id: 11,
        name: 'Future Perfect Continuous',
        code: 'will + have + been + V-ing',
        turkish: 'Gelecek Devamlı Tamamlanmışı',
        rule: 'Gelecekte belirli zamana kadar ne kadar süredir yapılmış olacak.',
        formula: [
            { label: 'Olumlu', text: 'will + have + been + V-ing' },
            { label: 'Olumsuz', text: 'will + have + not + been + V-ing' },
            { label: 'Soru', text: 'Will + subject + have + been + V-ing?' }
        ],
        timelineType: 'future-perfect-continuous',
        timelineDesc: 'Geçmiş ═════════════ ŞİMDİ ═════════════ Gelecek (═════→→) ═ Gelecek\nGelecekte belirli sürede yapılmış olacak',
        examples: [
            { en: 'By next Friday, I will have been studying for 6 months.', tr: 'Cuma günü 6 aydır çalışmış olacağım.' },
            { en: 'By the end of the year, she will have been working here for 3 years.', tr: 'Yıl sonunda 3 yıldır burada çalışmış olacak.' },
            { en: 'When he retires, he will have been teaching for 40 years.', tr: 'Emekliye ayrılınca 40 yıl öğretmenlik yapmış olacak.' }
        ],
        commonMistakes: [
            { wrong: 'I will have studied for 6 months', right: 'I will have been studying for 6 months', explanation: 'Süre vurgulansa been + V-ing lazım' }
        ]
    }
];

let stats = { correct: 0, wrong: 0, streak: 0, total: 0 };
let currentTenseId = 0;
let identifyLanguage = null;
let identifySentence = null;
let buildSentence = null;

function init() {
    renderTenseGrid();
    renderLesson(0);
}

function renderTenseGrid() {
    const grid = document.getElementById('tense-grid');
    grid.innerHTML = '';

    TENSES_DB.forEach((tense, idx) => {
        const btn = document.createElement('button');
        btn.className = `tense-option ${idx === 0 ? 'active' : ''}`;
        btn.innerHTML = `<span class="tense-name">${tense.name}</span><span class="tense-code">${tense.code}</span>`;
        btn.onclick = () => switchTense(idx);
        grid.appendChild(btn);
    });
}

function switchTense(idx) {
    currentTenseId = idx;
    document.querySelectorAll('.tense-option').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
    });
    renderLesson(idx);
}

function renderLesson(idx) {
    const tense = TENSES_DB[idx];
    const content = document.getElementById('lesson-content');

    let formulaHtml = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px;">';
    tense.formula.forEach(f => {
        formulaHtml += `
            <div style="background: white; padding: 12px; border-radius: 8px; border-left: 3px solid var(--primary); font-size: 11px;">
                <strong style="color: var(--primary); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px;">${f.label}</strong>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #1e40af; line-height: 1.5;">${f.text}</div>
            </div>
        `;
    });
    formulaHtml += '</div>';

    const examplesHtml = `
        <div class="collapsible-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">📚 Örnek Cümleler</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-content">
                ${tense.examples.map(ex => `
                    <div style="background: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid var(--primary);">
                        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--primary); font-weight: 600; margin-bottom: 3px;">"${ex.en}"</div>
                        <div style="font-size: 11px; color: var(--text-muted); font-style: italic;">${ex.tr}</div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;

    const mistakesHtml = `
        <div class="collapsible-section">
            <div class="section-header" onclick="toggleSection(this)">
                <span class="section-title">⚠️ Sık Yapılan Hatalar</span>
                <span class="section-toggle">▼</span>
            </div>
            <div class="section-content">
                ${tense.commonMistakes.map(m => `
                    <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--error);">
                        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-bottom: 6px;">
                            <span style="color: var(--error); font-weight: 700; text-decoration: line-through;">❌ ${m.wrong}</span>
                            <span style="color: var(--dark-green); font-weight: 700; background: #dcfce7; padding: 2px 6px; border-radius: 3px; margin-left: 8px;">✓ ${m.right}</span>
                        </div>
                        <div style="font-size: 11px; color: var(--text); line-height: 1.5;">${m.explanation}</div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;

    const timelineSvg = createTimelineSVG(tense.timelineType);

    content.innerHTML = `
        <div class="lesson-header">
            <div class="tense-title">${tense.name}</div>
            <div class="tense-subtitle">${tense.turkish}</div>
            <div class="rule-statement">${tense.rule}</div>
        </div>

        <div class="timeline-container">
            <strong style="display: block; margin-bottom: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted);">⏰ Zaman Çizelgesi</strong>
            <div class="timeline-svg">${timelineSvg}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 12px; line-height: 1.6; white-space: pre-line;">${tense.timelineDesc}</div>
        </div>

        <div style="margin-bottom: 15px;">
            <strong style="display: block; margin-bottom: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--primary);">Yapı Formülleri</strong>
            ${formulaHtml}
        </div>

        ${examplesHtml}
        ${mistakesHtml}

        <div class="practice-section">
            <div class="practice-title">✏️ PROFESYONEL UYGULAMA</div>
            <div class="practice-subtitle">
                ${tense.name} yapısını üç aşamada derinlemesine öğren.
            </div>

            <div class="practice-tabs">
                <button class="tab-btn active" onclick="switchTab(this, 'tab1')">1️⃣ Örnek İste</button>
                <button class="tab-btn" onclick="switchTab(this, 'tab2')">2️⃣ Zamanı Tanı</button>
                <button class="tab-btn" onclick="switchTab(this, 'tab3')">3️⃣ Sende Yaz</button>
            </div>

            <div class="tab-content active" id="tab1">
                <div class="step-label">Adım 1: Örnek Cümle İste</div>
                <div class="step-desc">Türkçe bir cümle yaz, senin cümleye uygun "${tense.name}" örneğini göstereceğim.</div>
                <textarea id="user-sentence" placeholder="Örnek: Ben her gün sabah 6'da uyanırım..."></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="provideExample(${idx})">Profesyonel Örnek Hazırla</button>
                    <button class="btn-secondary" onclick="switchTab(null, 'tab2')">Atla</button>
                </div>
                <div class="feedback-box" id="feedback-example"></div>
            </div>

            <div class="tab-content" id="tab2">
                <div id="identify-stage-1">
                    <div class="step-label">Adım 2A: Dil Seç</div>
                    <div class="step-desc">Verilen cümle İngilizce mi yoksa Türkçe mi? Önce seç!</div>
                    <div class="choice-group">
                        <button class="choice-btn" onclick="selectLanguage(this, 'en')">🇬🇧 ENGLISH</button>
                        <button class="choice-btn" onclick="selectLanguage(this, 'tr')">🇹🇷 TÜRKÇE</button>
                    </div>
                    <div id="sentence-display" style="display: none;">
                        <div class="step-label" style="margin-top: 15px;">Verilen Cümle:</div>
                        <div class="english-display" id="identify-sentence-display">Cümle yüklenecek...</div>
                        <button class="btn-primary" onclick="moveToIdentify()" style="width: 100%; margin-top: 15px;">Devam → Zamanı Tanı</button>
                    </div>
                </div>

                <div id="identify-stage-2" style="display: none;">
                    <div class="step-label">Adım 2B: Zamanı Tanı</div>
                    <div class="step-desc">Aşağıdaki cümlenin hangi zaman yapısında olduğunu yaz.</div>
                    <div class="english-display" id="identify-sentence-for-tense">Cümle...</div>
                    <input type="text" id="identify-answer" placeholder="Zaman adını yaz (örn: Present Perfect, Simple Past)...">
                    <div class="button-group">
                        <button class="btn-primary" onclick="identifyTense()">Kontrol Et</button>
                        <button class="btn-secondary" onclick="switchTab(null, 'tab3')">Atla</button>
                    </div>
                    <div class="feedback-box" id="feedback-identify"></div>
                </div>
            </div>

            <div class="tab-content" id="tab3">
                <div class="step-label">Adım 3: Sende Yaz (AI Powered)</div>
                <div class="step-desc">
                    Türkçe cümleyi "${tense.name}" yapısında İngilizceye çevir.<br>
                    <strong>Formula:</strong> <code style="background: #f0f4ff; padding: 2px 6px; font-size: 10px; border-radius: 3px;">${tense.formula[0].text.split('<br>')[0]}</code>
                </div>
                <div class="english-display" style="background: var(--primary-light);">
                    Türkçe: <span id="build-tr-sentence">Cümle...</span>
                </div>
                <textarea id="build-answer" placeholder="İngilizce çevirini yaz..."></textarea>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
                    💡 Ipucu: Formula'yı takip et. Sık yapılan hataları düşün!
                </div>
                <div class="button-group">
                    <button class="btn-primary" onclick="checkBuilt(${idx})">AI Kontrol Et</button>
                    <button class="btn-secondary" onclick="resetPractice()">Başa Dön</button>
                </div>
                <div class="loading" id="loading-ai"></div>
                <div class="feedback-box" id="feedback-build"></div>
            </div>
        </div>
    `;

    generatePracticeSentences(tense);
}

function createTimelineSVG(type) {
    let svg = `<svg viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 150px;">`;

    svg += `<line x1="30" y1="75" x2="470" y2="75" stroke="#cbd5e1" stroke-width="2"/>`;
    svg += `<text x="30" y="120" font-size="12" font-weight="600" fill="#64748b">Past</text>`;
    svg += `<text x="220" y="120" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Present</text>`;
    svg += `<text x="440" y="120" font-size="12" font-weight="600" fill="#64748b" text-anchor="end">Future</text>`;

    svg += `<circle cx="30" cy="75" r="5" fill="#64748b"/>`;
    svg += `<circle cx="250" cy="75" r="5" fill="#2563eb"/>`;
    svg += `<circle cx="470" cy="75" r="5" fill="#64748b"/>`;

    if (type === 'simple-present') {
        for (let i = 0; i < 5; i++) {
            const x = 230 + (i - 2) * 20;
            svg += `<circle cx="${x}" cy="75" r="3" fill="#2563eb"/>`;
        }
    } else if (type === 'present-continuous') {
        svg += `<path d="M 200 75 Q 250 40, 300 75" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="4,2"/>`;
    } else if (type === 'simple-past') {
        svg += `<circle cx="30" cy="75" r="7" fill="#2563eb" opacity="0.6"/>`;
    } else if (type === 'past-continuous') {
        svg += `<path d="M 10 75 Q 60 40, 110 75" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="4,2"/>`;
    } else if (type === 'present-perfect') {
        svg += `<path d="M 50 75 Q 150 50, 250 75" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>`;
    } else if (type === 'present-perfect-continuous') {
        svg += `<path d="M 30 75 Q 140 45, 250 75" stroke="#10b981" stroke-width="3" fill="none" opacity="0.4"/>`;
    } else if (type === 'simple-future') {
        for (let i = 0; i < 5; i++) {
            const x = 450 + (i - 2) * 20;
            svg += `<circle cx="${x}" cy="75" r="3" fill="#2563eb"/>`;
        }
    } else if (type === 'future-continuous') {
        svg += `<path d="M 420 75 Q 470 40, 520 75" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="4,2"/>`;
    } else if (type === 'past-perfect') {
        svg += `<circle cx="40" cy="75" r="4" fill="#f59e0b"/>`;
        svg += `<circle cx="80" cy="75" r="4" fill="#f59e0b" opacity="0.4"/>`;
    } else if (type === 'past-perfect-continuous') {
        svg += `<path d="M 30 75 Q 80 45, 150 75" stroke="#10b981" stroke-width="3" fill="none" opacity="0.4"/>`;
    } else if (type === 'future-perfect') {
        svg += `<circle cx="400" cy="75" r="4" fill="#f59e0b"/>`;
        svg += `<circle cx="450" cy="75" r="4" fill="#f59e0b" opacity="0.4"/>`;
    } else if (type === 'future-perfect-continuous') {
        svg += `<path d="M 350 75 Q 410 45, 470 75" stroke="#10b981" stroke-width="3" fill="none" opacity="0.4"/>`;
    }

    svg += `<defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#f59e0b"/></marker></defs>`;
    svg += `</svg>`;

    return svg;
}

function toggleSection(header) {
    const toggle = header.querySelector('.section-toggle');
    const content = header.nextElementSibling;
    toggle.classList.toggle('open');
    content.classList.toggle('open');
}

function switchTab(btn, tabId) {
    if (btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    
    if (tabId === 'tab2') {
        document.getElementById('identify-stage-1').style.display = 'block';
        document.getElementById('identify-stage-2').style.display = 'none';
        identifyLanguage = null;
        document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('sentence-display').style.display = 'none';
    }
}

function selectLanguage(btn, lang) {
    identifyLanguage = lang;
    document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    document.getElementById('sentence-display').style.display = 'block';
}

function moveToIdentify() {
    if (!identifyLanguage) {
        alert('Lütfen bir dil seçin!');
        return;
    }

    document.getElementById('identify-stage-1').style.display = 'none';
    document.getElementById('identify-stage-2').style.display = 'block';
    
    if (identifyLanguage === 'en') {
        document.getElementById('identify-sentence-for-tense').textContent = identifySentence.en;
    } else {
        document.getElementById('identify-sentence-for-tense').textContent = identifySentence.tr;
    }
}

function generatePracticeSentences(tense) {
    const randomTense = TENSES_DB[Math.floor(Math.random() * TENSES_DB.length)];
    identifySentence = randomTense.examples[Math.floor(Math.random() * randomTense.examples.length)];
    
    document.getElementById('identify-sentence-display').textContent = 
        identifyLanguage === 'en' ? identifySentence.en : identifySentence.tr;

    buildSentence = tense.examples[Math.floor(Math.random() * tense.examples.length)];
    document.getElementById('build-tr-sentence').textContent = buildSentence.tr;
}

function provideExample(idx) {
    const userInput = document.getElementById('user-sentence').value.trim();
    if (!userInput) {
        alert('Lütfen Türkçe bir cümle yazınız!');
        return;
    }

    const tense = TENSES_DB[idx];
    const feedback = document.getElementById('feedback-example');

    feedback.className = 'feedback-box correct show';
    feedback.innerHTML = `
        <div class="feedback-header">
            <span>✓</span>
            <span>Profesyonel Örnek Analizi</span>
        </div>
        <div class="feedback-content">
            <strong>Senin Cümle:</strong> ${userInput}
            <br><br>
            <strong>English (${tense.name}):</strong>
            <div class="english-display" style="margin: 8px 0;">${tense.examples[0].en}</div>
            <strong>Formula:</strong> ${tense.formula[0].text.split('<br>')[0]}
        </div>
    `;
}

function identifyTense() {
    const answer = document.getElementById('identify-answer').value.trim().toLowerCase();
    const feedback = document.getElementById('feedback-identify');

    if (!answer) {
        alert('Lütfen bir zaman adı yazınız!');
        return;
    }

    let found = false;
    let foundTense = null;

    for (let tense of TENSES_DB) {
        if (tense.name.toLowerCase() === answer.toLowerCase()) {
            found = true;
            foundTense = tense;
            break;
        }
    }

    if (found) {
        feedback.className = 'feedback-box correct show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span>🎉</span>
                <span>Doğru Tanı!</span>
            </div>
            <div class="feedback-content">
                <strong>Bulduğun Zaman:</strong> ${foundTense.name}
                <br><strong>Formula:</strong> ${foundTense.formula[0].text.split('<br>')[0]}
            </div>
        `;
        stats.correct++;
        stats.streak++;
    } else {
        feedback.className = 'feedback-box incorrect show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span>❌</span>
                <span>Bir Daha Dene</span>
            </div>
        `;
        stats.wrong++;
        stats.streak = 0;
    }

    stats.total++;
    updateStats();
}

function checkBuilt(idx) {
    const userAnswer = document.getElementById('build-answer').value.trim();
    const tense = TENSES_DB[idx];
    const feedback = document.getElementById('feedback-build');
    const loading = document.getElementById('loading-ai');

    if (!userAnswer) {
        alert('Lütfen bir cümle yazınız!');
        return;
    }

    loading.classList.add('show');
    loading.innerHTML = '<div class="spinner"></div> AI Kontrol Ediliyor...';

    setTimeout(() => {
        const correctAnswer = buildSentence.en.toLowerCase();
        const userLower = userAnswer.toLowerCase();
        
        const words = correctAnswer.split(/\s+/);
        const userWords = userLower.split(/\s+/);
        const matchedWords = userWords.filter(w => correctAnswer.includes(w)).length;
        const similarity = matchedWords / Math.max(words.length, userWords.length);

        loading.classList.remove('show');

        if (similarity > 0.80) {
            feedback.className = 'feedback-box correct show';
            feedback.innerHTML = `
                <div class="feedback-header">
                    <span>🏆</span>
                    <span>Mükemmel! Profesyonel Seviyede!</span>
                </div>
                <div class="feedback-content">
                    <strong>Doğru Cevab:</strong> ${buildSentence.en}
                    <br><br>
                    ⭐ ${tense.name} yapısını tamamen anlamışsın!
                </div>
            `;
            stats.correct++;
            stats.streak++;
        } else if (similarity > 0.55) {
            feedback.className = 'feedback-box incorrect show';
            feedback.innerHTML = `
                <div class="feedback-header">
                    <span>🤔</span>
                    <span>Yakın! Düzelt</span>
                </div>
                <div class="feedback-content">
                    <strong>Doğru Şekil:</strong> ${buildSentence.en}
                    <br><br>
                    <strong>Formula:</strong> ${tense.formula[0].text.split('<br>')[0]}
                </div>
            `;
            stats.wrong++;
            stats.streak = 0;
        } else {
            feedback.className = 'feedback-box incorrect show';
            feedback.innerHTML = `
                <div class="feedback-header">
                    <span>❌</span>
                    <span>Daha Çalış</span>
                </div>
                <div class="feedback-content">
                    <strong>Doğru Cevab:</strong> ${buildSentence.en}
                    <br><br>
                    Örnekleri tekrar oku ve sık yapılan hataları düşün!
                </div>
            `;
            stats.wrong++;
            stats.streak = 0;
        }

        stats.total++;
        updateStats();
    }, 1500);
}

function resetPractice() {
    document.getElementById('user-sentence').value = '';
    document.getElementById('identify-answer').value = '';
    document.getElementById('build-answer').value = '';
    document.querySelectorAll('.feedback-box').forEach(fb => fb.classList.remove('show'));
    switchTab(document.querySelector('.tab-btn'), 'tab1');
}

function updateStats() {
    document.getElementById('stat-correct').textContent = stats.correct;
    document.getElementById('stat-wrong').textContent = stats.wrong;
    document.getElementById('stat-streak').textContent = stats.streak;
    
    const accuracy = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
    document.getElementById('stat-accuracy').textContent = accuracy + '%';
}

init();
</script>

</body>
</html>
