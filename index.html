<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Grammar Master — 12 Tense Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-light: #dbeafe;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }

        .tense-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .tense-btn {
            padding: 10px 12px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            transition: all 0.3s;
            text-align: left;
        }

        .tense-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .tense-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .main-card {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .tense-header {
            margin-bottom: 25px;
        }

        .tense-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .tense-turkish {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .rule-box {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .example-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .examples {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .example {
            background: #f0f9ff;
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
            font-size: 13px;
            line-height: 1.6;
        }

        .example strong {
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
            font-family: 'IBM Plex Mono', monospace;
        }

        .example-tr {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 4px;
            font-style: italic;
        }

        .usage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .usage-box {
            background: var(--bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 12px;
            text-align: center;
        }

        .usage-box strong {
            display: block;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .quiz-section {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
        }

        .quiz-title {
            font-weight: 700;
            color: var(--warning);
            margin-bottom: 15px;
        }

        .quiz-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .quiz-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
        }

        .quiz-input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .quiz-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .quiz-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-check {
            background: var(--warning);
            color: white;
            flex: 1;
        }

        .btn-check:hover {
            background: #d97706;
        }

        .btn-skip {
            background: var(--border);
            color: var(--text);
        }

        .btn-skip:hover {
            background: #cbd5e1;
        }

        .feedback {
            display: none;
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 10px;
            font-size: 13px;
            animation: slideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            color: var(--success);
        }

        .feedback.incorrect {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: var(--error);
        }

        .feedback strong {
            display: block;
            margin-bottom: 5px;
        }

        .explanation {
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 12px;
            line-height: 1.5;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress {
            background: var(--border);
            height: 3px;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            .main-card {
                padding: 20px;
            }
            .tense-name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">🎯 English Grammar Master</div>
        <div class="tagline">12 İngilizce Zaman Yapısı Öğrenme Uygulaması</div>
    </header>

    <div class="grid">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3 style="margin-bottom: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">📊 Gelişmen</h3>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">✓ Doğru</span>
                    <span class="stat-value" id="correct">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">✗ Yanlış</span>
                    <span class="stat-value" id="wrong">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">🔥 Seri</span>
                    <span class="stat-value" id="streak">0</span>
                </div>
            </div>

            <h3 style="margin-top: 25px; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">⏰ Zamanlar</h3>
            <div class="tense-list" id="tense-list"></div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-card">
            <div class="progress">
                <div class="progress-fill" id="progress" style="width: 0%"></div>
            </div>

            <div id="tense-content"></div>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// TENSES DATABASE
// ════════════════════════════════════════════════════════════════════════

const TENSES = [
    {
        id: 0,
        name: 'Simple Present',
        turkish: 'Basit Şimdiki Zaman',
        rule: 'Habitual action, general truth, facts. Düzenli tekrarlanan eylemler, genel gerçekler için kullanılır.',
        structure: 'I/You/We/They + V | He/She/It + V+s',
        explanation: `
            <strong>Tanım:</strong> Alışkanlık, sabit gerçekler veya her gün tekrarlanan eylemler için kullanılır.
            <br><strong>Kurması:</strong> Pozitif cümlelerde fiil + "s" takısı (3. tekil şahıs için)
            <br><strong>Zaman İşareti:</strong> every day, usually, always, often, sometimes
        `,
        usage: [
            { title: 'Alışkanlık', desc: 'Her gün yapılan iş' },
            { title: 'Genel Gerçek', desc: 'Değişmeyen durumlar' },
            { title: 'Takvim', desc: 'Sabitlenmiş zamanlar' }
        ],
        examples: [
            {
                en: 'I eat breakfast every morning.',
                tr: 'Ben her sabah kahvaltı yerim.',
                wrong: 'I eats breakfast every morning.',
                explanation: 'Çünkü "I" ilk tekil şahıs; "s" takısı sadece he/she/it için eklenir.'
            },
            {
                en: 'She plays tennis on Sundays.',
                tr: 'O, pazarları tenis oynar.',
                wrong: 'She play tennis on Sundays.',
                explanation: 'He/She/It ile her zaman fiil + "s" eklenir. "plays" doğru.'
            },
            {
                en: 'They go to the market on Fridays.',
                tr: 'Onlar cuma günleri pazara giderler.',
                wrong: 'They goes to the market on Fridays.',
                explanation: 'They (çoğul) ile "s" takısı eklenmez. "go" doğru.'
            },
            {
                en: 'The sun rises in the east.',
                tr: 'Güneş doğudan doğar.',
                wrong: 'The sun rise in the east.',
                explanation: 'Genel gerçek için basit şimdiki; "rises" doğru.'
            }
        ],
        quiz: [
            {
                question: 'Türkçe: "O her gün spor yapar."',
                answer: 'She exercises every day.',
                hints: ['She → +s takısı eklenir', 'every day → alışkanlık göstergesi']
            },
            {
                question: 'Türkçe: "Biz pazar günü pazara gideriz."',
                answer: 'We go to the market on Sunday.',
                hints: ['We → "s" takısı YOK', 'on Sunday → gün belirtmek']
            }
        ]
    },
    {
        id: 1,
        name: 'Present Continuous',
        turkish: 'Şu Anki Devamlı Zaman',
        rule: 'Right now happening. Şu anda yapılmakta olan eylemler.',
        structure: 'am/is/are + V-ing',
        explanation: `
            <strong>Tanım:</strong> Konuşmanın yapıldığı anda gerçekleşmekte olan eylemleri anlatır.
            <br><strong>Kurması:</strong> am/is/are + fiilin -ing hali
            <br><strong>Zaman İşareti:</strong> now, right now, at this moment, these days
        `,
        usage: [
            { title: 'Şu An', desc: 'Konuşma sırasında devam eden işler' },
            { title: 'Geçici', desc: 'Bu dönem için geçici durumlar' },
            { title: 'Geleceği', desc: 'Planlanmış gelecek eylemler' }
        ],
        examples: [
            {
                en: 'I am reading a book right now.',
                tr: 'Ben şu anda bir kitap okuyorum.',
                wrong: 'I am read a book right now.',
                explanation: 'Present continuous = am/is/are + V-ing. "reading" doğru; "read" yanlış.'
            },
            {
                en: 'She is studying for her exam.',
                tr: 'O sınav için çalışmaktadır.',
                wrong: 'She is study for her exam.',
                explanation: '-ing hali gerekli: "studying" doğru.'
            },
            {
                en: 'They are playing football in the park.',
                tr: 'Onlar parkta futbol oynamaktadırlar.',
                wrong: 'They are play football in the park.',
                explanation: 'are + play-ing = "are playing" doğru.'
            },
            {
                en: 'What are you doing?',
                tr: 'Sen ne yapıyorsun?',
                wrong: 'What are you do?',
                explanation: 'Soru formunda da -ing hali korunur.'
            }
        ],
        quiz: [
            {
                question: 'Türkçe: "Onlar şu anda sınava girmektedir."',
                answer: 'They are taking the exam right now.',
                hints: ['are + V-ing iki kısım var', 'take → taking']
            },
            {
                question: 'Türkçe: "Ben bilgisayardan oynuyorum."',
                answer: 'I am playing on the computer.',
                hints: ['I → am kullan', 'V → V-ing haline çevir']
            }
        ]
    },
    {
        id: 2,
        name: 'Simple Past',
        turkish: 'Geçmiş Zaman',
        rule: 'Finished action in the past. Geçmişte tamamlanmış eylemler.',
        structure: 'V-ed (regular) | V-changed (irregular)',
        explanation: `
            <strong>Tanım:</strong> Geçmişte tamamlanmış ve biten eylemleri anlatır.
            <br><strong>Kurması:</strong> Regular: fiil + -ed | Irregular: değişir (go→went, eat→ate)
            <br><strong>Zaman İşareti:</strong> yesterday, last week, ago, in 2023, when I was 10
        `,
        usage: [
            { title: 'Bitmiş İş', desc: 'Geçmişte tamamlanan eylemleri' },
            { title: 'Anı', desc: 'Belirli zamanlardaki eylemler' },
            { title: 'Sıra', desc: 'Geçmişte birbiri ardına gelen olaylar' }
        ],
        examples: [
            {
                en: 'I learned English last year.',
                tr: 'Geçen yıl İngilizce öğrendim.',
                wrong: 'I learn English last year.',
                explanation: '"last year" geçmiş zamandır → Simple Past kullan. "learned" doğru.'
            },
            {
                en: 'She went to London yesterday.',
                tr: 'Dün o Londra\'ya gitti.',
                wrong: 'She goed to London yesterday.',
                explanation: '"go" düzensiz fiil. Past: "went" (goed yok!)'
            },
            {
                en: 'They watched a movie last night.',
                tr: 'Dün gece bir film izlediler.',
                wrong: 'They watching a movie last night.',
                explanation: 'Past Continuous değil Simple Past. "watched" doğru.'
            },
            {
                en: 'Did you eat breakfast this morning?',
                tr: 'Bu sabah kahvaltı yaptın mı?',
                wrong: 'Did you ate breakfast this morning?',
                explanation: 'Sorular: Did + V. "eat" doğru; "ate" yanlış.'
            }
        ],
        quiz: [
            {
                question: 'Türkçe: "O dün markete gitti ve alışveriş yaptı."',
                answer: 'She went to the market yesterday and went shopping.',
                hints: ['go → went (irregular)', 'yesterday → Simple Past', 'went shopping → geçmiş tamamlı']
            },
            {
                question: 'Türkçe: "Siz geçen hafta sınava giriyor muydunuz?"',
                answer: 'Did you take the exam last week?',
                hints: ['take → took (irregular)', 'Did + V yapısı sorular için']
            }
        ]
    },
    {
        id: 3,
        name: 'Past Continuous',
        turkish: 'Geçmiş Devamlı Zaman',
        rule: 'Was/Were doing in the past. Geçmişte devam eden eylemler.',
        structure: 'was/were + V-ing',
        explanation: `
            <strong>Tanım:</strong> Geçmişte belirli bir anda devam etmekte olan eylemleri anlatır.
            <br><strong>Kurması:</strong> was/were + V-ing
            <br><strong>Zaman İşareti:</strong> while, when, at 3 o\'clock yesterday, during the meeting
            <br><strong>Notlar:</strong> Sık Simple Past ile karışır. Was/were + ing = durum devam ediyor
        `,
        usage: [
            { title: 'Anlık Durum', desc: 'Belirli zamanda devam eden eylem' },
            { title: 'Araya Giren', desc: 'Araya gelen eylem tarafından kesilen durum' },
            { title: 'Kesişme', desc: 'İki eş zamanlı geçmiş eylem' }
        ],
        examples: [
            {
                en: 'I was sleeping when the phone rang.',
                tr: 'Telefon çaldığında ben uyuyordum.',
                wrong: 'I was sleep when the phone rang.',
                explanation: 'was + V-ing şekli gerekli. "sleeping" doğru.'
            },
            {
                en: 'She was studying while he was cooking.',
                tr: 'O yemek pişirirken, o çalışıyordu.',
                wrong: 'She studied while he cooked.',
                explanation: 'Aynı anda devam eden eylemlerde Past Continuous kullan.'
            },
            {
                en: 'They were playing football at 5 PM yesterday.',
                tr: 'Dün saat 5\'te futbol oynuyorlardı.',
                wrong: 'They played football at 5 PM yesterday.',
                explanation: 'Belirli zamanda devam eden durum → Past Continuous.'
            },
            {
                en: 'What were you doing when I called?',
                tr: 'Seni aradığımda sen ne yapıyordun?',
                wrong: 'What did you do when I called?',
                explanation: 'Yapılmakta olan durum → Past Continuous.'
            }
        ],
        quiz: [
            {
                question: 'Türkçe: "Öğretmen konuşurken, öğrenciler dinliyorlardı."',
                answer: 'The teacher was speaking while the students were listening.',
                hints: ['was + V-ing her iki olay', 'while = aynı anda']
            },
            {
                question: 'Türkçe: "Saat 10\'da ben uyuyordum."',
                answer: 'I was sleeping at 10 o\'clock.',
                hints: ['belirli zaman + was + V-ing', 'sleep → sleeping']
            }
        ]
    },
    {
        id: 4,
        name: 'Present Perfect',
        turkish: 'Şimdiki Zaman Tamamlanmış',
        rule: 'Recently completed or continues to now. Yakın geçmişte başlayan, hala etkisi devam eden.',
        structure: 'have/has + V-ed (past participle)',
        explanation: `
            <strong>Tanım:</strong> Yakın geçmişte başlayan veya bitan, şu ana kadar etkisi devam eden eylemleri anlatır.
            <br><strong>Kurması:</strong> have/has + Past Participle
            <br><strong>Zaman İşareti:</strong> yet, already, ever, never, just, recently, for, since
            <br><strong>Kritik:</strong> "zamanı belirtme" (yesterday, last week) yok! Geçmişi gösterir ama zaman belirtmez.
        `,
        usage: [
            { title: 'Az Önce', desc: 'Yakında tamamlanan işler (just)' },
            { title: 'Tecrübe', desc: 'Hayatta hiç/şu ana kadar (never/ever)' },
            { title: 'Devam', desc: 'Geçmişten başlayıp devam eden (for/since)' }
        ],
        examples: [
            {
                en: 'I have finished my homework.',
                tr: 'Ben ödevimi bitirdim (hala etkileri var).',
                wrong: 'I have finish my homework.',
                explanation: 'have + Past Participle. "finished" doğru; "finish" yanlış.'
            },
            {
                en: 'She has never been to Paris.',
                tr: 'O, Paris\'e hiç gitmedi (hayatında).',
                wrong: 'She has never go to Paris.',
                explanation: 'has + Past Participle. "been" (go→be) doğru.'
            },
            {
                en: 'They have already eaten dinner.',
                tr: 'Onlar çoktan akşam yemeğini yediler.',
                wrong: 'They have already eat dinner.',
                explanation: 'have + Past Participle. "eaten" doğru.'
            },
            {
                en: 'I have lived here for 5 years.',
                tr: '5 yıldır burada yaşıyorum (hala yaşıyorum).',
                wrong: 'I have been live here for 5 years.',
                explanation: 'have lived doğru; bu olay geçmişte başlayıp şimdi devam ediyor.'
            }
        ],
        quiz: [
            {
                question: 'Türkçe: "Ben bu kitabı henüz okumadım."',
                answer: 'I have not read this book yet.',
                hints: ['have/has + Past Participle', 'yet = henüz (olumsuz)']
            },
            {
                question: 'Türkçe: "O 10 yıldır bu şirkette ��alışıyor."',
                answer: 'She has worked in this company for 10 years.',
                hints: ['for + süre → Present Perfect', 'worked (past participle)']
            }
        ]
    },
    {
        id: 5,
        name: 'Present Perfect Continuous',
        turkish: 'Şimdiki Zaman Devamlı Tamamlanmış',
        rule: 'Has been doing since/for. Geçmişten başlayıp şimdi devam eden eylemleri vurgular.',
        structure: 'have/has + been + V-ing',
        explanation: `
            <strong>Tanım:</strong> Geçmişte başlayan ve şu ana kadar DEVAM eden eylemlerin süresi vurgular.
            <br><strong>Kurması:</strong> have/has + been + V-ing
            <br><strong>Zaman İşareti:</strong> for, since, all morning, all day, how long
            <br><strong>Fark:</strong> Present Perfect (sonuç), Present Perfect Continuous (süre ve devam)
        `,
        usage: [
            { title: 'Başlangıç', desc: 'Ne zamandan beri yapıyor' },
            { title: 'Devam', desc: 'Hala yapılıyor' },
            { title: 'Süre', desc: 'Ne kadar süre boyunca' }
        ],
        examples: [
            {
                en: 'I have been studying for 3 hours.',
                tr: '3 saattir çalışıyorum (hala çalışıyor).',
                wrong: 'I have studied for 3 hours.',
                explanation: 'Süreyi vurgula: have + been + V-ing. "been studying" doğru.'
            },
            {
                en: 'She has been living in Istanbul since 2020.',

// ════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════

let currentTenseIndex = 0;
let correct = 0;
let wrong = 0;
let streak = 0;
let currentQuizIndex = 0;

// ════════════════════════════════════════════════════════════════════════
// INITIALIZATION
// ════════════════════════════════════════════════════════════════════════

function init() {
    renderTenseList();
    renderTenseContent(0);
}

function renderTenseList() {
    const list = document.getElementById('tense-list');
    TENSES.forEach((tense, idx) => {
        const btn = document.createElement('button');
        btn.className = `tense-btn ${idx === 0 ? 'active' : ''}`;
        btn.textContent = tense.name;
        btn.onclick = () => switchTense(idx);
        list.appendChild(btn);
    });
}

function switchTense(idx) {
    currentTenseIndex = idx;
    currentQuizIndex = 0;
    document.querySelectorAll('.tense-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
    });
    renderTenseContent(idx);
    document.querySelector('.main-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderTenseContent(idx) {
    const tense = TENSES[idx];
    const progress = ((idx + 1) / TENSES.length) * 100;
    document.getElementById('progress').style.width = progress + '%';

    let usageHtml = '';
    if (tense.usage) {
        usageHtml = '<div class="usage-grid">';
        tense.usage.forEach(u => {
            usageHtml += `<div class="usage-box"><strong>${u.title}</strong>${u.desc}</div>`;
        });
        usageHtml += '</div>';
    }

    let examplesHtml = '';
    tense.examples.forEach(ex => {
        examplesHtml += `
            <div class="example">
                <strong>✓ ${ex.en}</strong>
                <div class="example-tr">${ex.tr}</div>
                <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,0.1); color: var(--error); font-size: 12px;">
                    <strong>❌ Yanlış: ${ex.wrong}</strong>
                    <div style="margin-top: 4px; color: var(--text-muted);">📝 ${ex.explanation}</div>
                </div>
            </div>
        `;
    });

    let quizHtml = '';
    const quiz = tense.quiz[currentQuizIndex];
    if (quiz) {
        quizHtml = `
            <div class="quiz-section">
                <div class="quiz-title">✎ Seni Sınasın</div>
                <div class="quiz-item">
                    <div class="quiz-question">${quiz.question}</div>
                    <input type="text" class="quiz-input" id="quiz-answer" placeholder="İngilizcesini yaz..." onkeypress="if(event.key==='Enter') checkQuiz()">
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">
                        <strong>💡 İpuçları:</strong> ${quiz.hints.map(h => `<span style="display: inline-block; background: rgba(255, 193, 7, 0.1); padding: 3px 8px; border-radius: 4px; margin-right: 5px; margin-top: 5px;">${h}</span>`).join('')}
                    </div>
                    <div class="quiz-buttons">
                        <button class="btn-check" onclick="checkQuiz()">Kontrol Et</button>
                        <button class="btn-skip" onclick="skipQuiz()">Geç</button>
                    </div>
                    <div class="feedback" id="quiz-feedback"></div>
                </div>
            </div>
        `;
    }

    document.getElementById('tense-content').innerHTML = `
        <div class="tense-header">
            <div class="tense-name">${tense.name}</div>
            <div class="tense-turkish">${tense.turkish}</div>
        </div>

        <div class="rule-box">
            <strong>Kural:</strong> ${tense.rule}<br><br>
            <strong>Yapısı:</strong> <code style="background: rgba(0,0,0,0.05); padding: 4px 8px; border-radius: 4px;">${tense.structure}</code><br><br>
            ${tense.explanation}
        </div>

        ${usageHtml}

        <div class="example-section">
            <div class="section-title">📚 Örnekler (Doğru ↔ Yanlış)</div>
            <div class="examples">
                ${examplesHtml}
            </div>
        </div>

        ${quizHtml}
    `;
}

function checkQuiz() {
    const answer = document.getElementById('quiz-answer').value.trim().toLowerCase();
    const quiz = TENSES[currentTenseIndex].quiz[currentQuizIndex];
    const correctAnswer = quiz.answer.toLowerCase();
    
    const feedback = document.getElementById('quiz-feedback');
    
    if (answer === correctAnswer) {
        feedback.className = 'feedback correct show';
        feedback.innerHTML = '<strong>✓ Doğru!</strong> Harika, bu yapısını öğrendin!';
        correct++;
        streak++;
    } else if (answer.includes(correctAnswer.split(' ')[0]) || correctAnswer.includes(answer.split(' ')[0])) {
        feedback.className = 'feedback incorrect show';
        feedback.innerHTML = `
            <strong>~ Neredeyse!</strong>
            <div class="explanation">
                Doğru cevap: <strong>${quiz.answer}</strong>
            </div>
        `;
        wrong++;
        streak = 0;
    } else {
        feedback.className = 'feedback incorrect show';
        feedback.innerHTML = `
            <strong>✗ Yanlış</strong>
            <div class="explanation">
                Doğru cevap: <strong>${quiz.answer}</strong>
            </div>
        `;
        wrong++;
        streak = 0;
    }

    updateStats();
    document.getElementById('quiz-answer').disabled = true;

    setTimeout(() => {
        currentQuizIndex = (currentQuizIndex + 1) % TENSES[currentTenseIndex].quiz.length;
        renderTenseContent(currentTenseIndex);
    }, 2000);
}

function skipQuiz() {
    currentQuizIndex = (currentQuizIndex + 1) % TENSES[currentTenseIndex].quiz.length;
    renderTenseContent(currentTenseIndex);
}

function updateStats() {
    document.getElementById('correct').textContent = correct;
    document.getElementById('wrong').textContent = wrong;
    document.getElementById('streak').textContent = streak;
}

// ════════════════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════════════════

init();
</script>
