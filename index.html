<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Tenses — Visual Timeline Learning</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-light: #dbeafe;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .tense-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .tense-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        .tense-card.active {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .tense-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .tense-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .tense-structure {
            background: #f0f4ff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--primary);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .timeline-visual {
            width: 100%;
            height: 80px;
            position: relative;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            overflow: hidden;
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #ccc;
            transform: translateY(-50%);
        }

        .timeline-point {
            position: absolute;
            top: 50%;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .timeline-zone {
            position: absolute;
            top: 30%;
            height: 40%;
            opacity: 0.3;
            border-radius: 4px;
        }

        .timeline-arc {
            position: absolute;
            top: 50%;
            height: 30px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .timeline-labels {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            font-size: 10px;
            color: var(--text-muted);
            padding: 0 10px;
        }

        .detail-view {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .detail-view.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-header {
            margin-bottom: 25px;
        }

        .detail-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .detail-subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .formula-box {
            background: #f0f4ff;
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .big-diagram {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: var(--bg);
            border-radius: 12px;
            border: 2px solid var(--border);
        }

        .big-timeline {
            position: relative;
            height: 150px;
            margin: 20px 0;
            display: flex;
            align-items: center;
        }

        .big-timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 3px;
            background: #ddd;
            z-index: 1;
        }

        .big-timeline-point {
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .big-timeline-zone {
            position: absolute;
            top: 35%;
            height: 30%;
            opacity: 0.2;
            border-radius: 6px;
            z-index: 2;
        }

        .big-timeline-labels {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .examples-section {
            margin: 30px 0;
        }

        .examples-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .example-block {
            background: #f0f9ff;
            border-left: 4px solid var(--primary);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
        }

        .example-block strong {
            color: var(--primary);
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            margin-bottom: 5px;
        }

        .example-block .tr {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 5px;
            font-style: italic;
        }

        .quiz-section {
            background: #fef3c7;
            border: 2px solid #fcd34d;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .quiz-title {
            font-weight: 700;
            color: var(--warning);
            margin-bottom: 15px;
        }

        .quiz-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .quiz-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
        }

        .quiz-input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .quiz-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .quiz-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-check {
            background: var(--warning);
            color: white;
            flex: 1;
        }

        .btn-check:hover {
            background: #d97706;
        }

        .btn-skip {
            background: var(--border);
            color: var(--text);
        }

        .btn-skip:hover {
            background: #cbd5e1;
        }

        .feedback {
            display: none;
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 10px;
            font-size: 13px;
            animation: slideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d1fae5;
            border: 1px solid #6ee7b7;
            color: var(--success);
        }

        .feedback.incorrect {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: var(--error);
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg);
            border-radius: 12px;
            justify-content: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .detail-view {
                padding: 20px;
            }
            .big-timeline {
                height: 120px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">📊 English Tenses — Visual Learning</div>
        <div class="tagline">12 Zamanı Timeline ile Öğren</div>
    </header>

    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="correct">0</div>
            <div class="stat-label">✓ Doğru</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="wrong">0</div>
            <div class="stat-label">✗ Yanlış</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="streak">0</div>
            <div class="stat-label">🔥 Seri</div>
        </div>
    </div>

    <!-- TENSE CARDS GRID -->
    <div class="grid" id="tenses-grid"></div>

    <!-- DETAIL VIEW -->
    <div class="detail-view" id="detail-view"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// TENSES DATABASE WITH VISUAL DATA
// ════════════════════════════════════════════════════════════════════════

const TENSES = [
    {
        id: 0,
        name: 'Simple Present',
        turkish: 'Basit Şimdiki',
        formula: 'V (base form) | V + s (3rd person)',
        timeline: { past: 'gray', present: 'blue-dots', future: 'gray' },
        diagram: 'Past ----X X X X X X---- Present ---- Future\n(Habit: She studies English)',
        rule: 'Alışkanlık, genel gerçekler',
        examples: [
            { en: 'I eat breakfast every day.', tr: 'Her gün kahvaltı yerim.' },
            { en: 'She plays tennis.', tr: 'O tenis oynar.' },
            { en: 'They go to school.', tr: 'Onlar okula gidiyorlar.' }
        ],
        quiz: [
            { q: 'Türkçe: "O her gün yürüyüş yapar."', a: 'She walks every day.' }
        ]
    },
    {
        id: 1,
        name: 'Present Continuous',
        turkish: 'Şu Anki Devamlı',
        formula: 'am/is/are + V-ing',
        timeline: { past: 'gray', present: 'red-arc', future: 'gray' },
        diagram: 'Past ----Present (ongoing)----- Future\n(Now: You are studying)',
        rule: 'Şu anda yapılmakta olan işler',
        examples: [
            { en: 'I am reading a book.', tr: 'Bir kitap okuyorum.' },
            { en: 'She is studying.', tr: 'O çalışıyor.' },
            { en: 'They are playing football.', tr: 'Onlar futbol oynuyorlar.' }
        ],
        quiz: [
            { q: 'Türkçe: "Onlar şu anda bir film izliyorlar."', a: 'They are watching a movie.' }
        ]
    },
    {
        id: 2,
        name: 'Simple Past',
        turkish: 'Geçmiş Zaman',
        formula: 'V-ed (regular) | V-changed (irregular)',
        timeline: { past: 'blue-point', present: 'gray', future: 'gray' },
        diagram: 'Past (X) ---- Present ---- Future\n(Finished: You studied yesterday)',
        rule: 'Geçmişte tamamlanmış eylemler',
        examples: [
            { en: 'I learned English last year.', tr: 'Geçen yıl İngilizce öğrendim.' },
            { en: 'She went to London.', tr: 'O Londra\'ya gitti.' },
            { en: 'They watched a movie.', tr: 'Onlar bir film izlediler.' }
        ],
        quiz: [
            { q: 'Türkçe: "Dün ben parkta oynattım."', a: 'I played in the park yesterday.' }
        ]
    },
    {
        id: 3,
        name: 'Past Continuous',
        turkish: 'Geçmiş Devamlı',
        formula: 'was/were + V-ing',
        timeline: { past: 'red-arc', present: 'gray', future: 'gray' },
        diagram: 'Past (ongoing) --X-- Present ---- Future\n(When: You were studying)',
        rule: 'Geçmişte belirli anda devam eden',
        examples: [
            { en: 'I was sleeping when you called.', tr: 'Sen aradığında ben uyuyordum.' },
            { en: 'She was studying.', tr: 'O çalışıyordu.' },
            { en: 'They were playing.', tr: 'Onlar oynuyorlardı.' }
        ],
        quiz: [
            { q: 'Türkçe: "Telefon çaldığında ben yemek yiyordum."', a: 'I was eating when the phone rang.' }
        ]
    },
    {
        id: 4,
        name: 'Present Perfect',
        turkish: 'Şimdiki Tamamlanmış',
        formula: 'have/has + Past Participle',
        timeline: { past: 'yellow-arc', present: 'yellow-circle', future: 'gray' },
        diagram: 'Past -----→ Present ---- Future\n(Recent: You have studied)',
        rule: 'Yakın geçmişten başlayan, hala etki var',
        examples: [
            { en: 'I have finished my homework.', tr: 'Ödevimi bitirdim.' },
            { en: 'She has never been to Paris.', tr: 'O Paris\'e hiç gitmedi.' },
            { en: 'They have already eaten.', tr: 'Onlar çoktan yediler.' }
        ],
        quiz: [
            { q: 'Türkçe: "Ben bu kitabı okudım."', a: 'I have read this book.' }
        ]
    },
    {
        id: 5,
        name: 'Present Perfect Continuous',
        turkish: 'Şimdiki Devamlı Tamamlanmış',
        formula: 'have/has + been + V-ing',
        timeline: { past: 'green-arc-long', present: 'green-circle', future: 'gray' },
        diagram: 'Past =========→ Present ---- Future\n(Duration: You have been studying for 3 hours)',
        rule: 'Geçmişten başlayıp şimdi devam eden, süresi önemli',
        examples: [
            { en: 'I have been studying for 3 hours.', tr: '3 saattir çalışıyorum.' },
            { en: 'She has been living here since 2020.', tr: '2020\'den beri burada yaşıyor.' },
            { en: 'They have been working all day.', tr: 'Onlar bütün gün çalışmaktalar.' }
        ],
        quiz: [
            { q: 'Türkçe: "2 saat boyunca oynuyorlar."', a: 'They have been playing for 2 hours.' }
        ]
    },
    {
        id: 6,
        name: 'Simple Future',
        turkish: 'Gelecek Zaman',
        formula: 'will + V (base form)',
        timeline: { past: 'gray', present: 'gray', future: 'blue-dots' },
        diagram: 'Past ---- Present ---- Future (X X X X)\n(Will: You will study)',
        rule: 'Gelecekte yapılacak eylemler',
        examples: [
            { en: 'I will call you tomorrow.', tr: 'Seni yarın arayacağım.' },
            { en: 'She will be a doctor.', tr: 'O doktor olacak.' },
            { en: 'They will arrive next week.', tr: 'Onlar gelecek hafta gelecekler.' }
        ],
        quiz: [
            { q: 'Türkçe: "Ben sana yarın yardım edeceğim."', a: 'I will help you tomorrow.' }
        ]
    },
    {
        id: 7,
        name: 'Future Continuous',
        turkish: 'Gelecek Devamlı',
        formula: 'will + be + V-ing',
        timeline: { past: 'gray', present: 'gray', future: 'red-arc' },
        diagram: 'Past ---- Present ---- Future (ongoing)\n(Will be: You will be studying)',
        rule: 'Gelecekte belirli anda devam edecek',
        examples: [
            { en: 'I will be working at 9 AM tomorrow.', tr: 'Yarın saat 9\'da çalışıyor olacağım.' },
            { en: 'She will be studying.', tr: 'O çalışıyor olacak.' },
            { en: 'They will be playing.', tr: 'Onlar oynuyor olacaklar.' }
        ],
        quiz: [
            { q: 'Türkçe: "Saat 5\'te ben çalışıyor olacağım."', a: 'I will be working at 5 o\'clock.' }
        ]
    },
    {
        id: 8,
        name: 'Past Perfect',
        turkish: 'Geçmiş Zamanın Geçmişi',
        formula: 'had + Past Participle',
        timeline: { past: 'yellow-arc-left', present: 'gray', future: 'gray' },
        diagram: 'Past (X earlier) ---- Past (X later) ---- Present ---- Future\n(Had: You had studied before)',
        rule: 'Geçmiş zamanda bir olaydan öncesi',
        examples: [
            { en: 'I had finished before the boss arrived.', tr: 'Patron gelmeden bitirdim.' },
            { en: 'She had left.', tr: 'O gitmişti.' },
            { en: 'They had already eaten.', tr: 'Onlar çoktan yemişlerdi.' }
        ],
        quiz: [
            { q: 'Türkçe: "O gelmeden önce ben çalışmıştım."', a: 'I had studied before she came.' }
        ]
    },
    {
        id: 9,
        name: 'Past Perfect Continuous',
        turkish: 'Geçmiş Devamlı Tamamlanmış',
        formula: 'had + been + V-ing',
        timeline: { past: 'green-arc-left', present: 'gray', future: 'gray' },
        diagram: 'Past (ongoing) ===X=== Past ---- Present ---- Future\n(Had been: You had been studying for hours)',
        rule: 'Geçmişte bir olaydan öncesi devam eden, süresi önemli',
        examples: [
            { en: 'I had been working for 8 hours when the power went out.', tr: 'Elektrik gitmeden 8 saat çalışmaktaydım.' },
            { en: 'She had been waiting since morning.', tr: 'O sabahtan beri beklemekteydi.' },
            { en: 'They had been playing for 2 hours.', tr: 'Onlar 2 saat oynamakta idiler.' }
        ],
        quiz: [
            { q: 'Türkçe: "Geldiğinde ben 3 saat bekliyordum."', a: 'I had been waiting for 3 hours when he came.' }
        ]
    },
    {
        id: 10,
        name: 'Future Perfect',
        turkish: 'Gelecek Tamamlanmışı',
        formula: 'will + have + Past Participle',
        timeline: { past: 'gray', present: 'gray', future: 'yellow-arc-right' },
        diagram: 'Past ---- Present ---- Future (X earlier) ---- Future (X later)\n(Will have: You will have studied)',
        rule: 'Gelecekte belirli zamana kadar tamamlanacak',
        examples: [
            { en: 'I will have finished by Friday.', tr: 'Cuma günü kadar bitirmiş olacağım.' },
            { en: 'She will have completed.', tr: 'O tamamlamış olacak.' },
            { en: 'They will have arrived.', tr: 'Onlar varmış olacaklar.' }
        ],
        quiz: [
            { q: 'Türkçe: "Yarın bu saatte ben uyuyuyor olacağım."', a: 'I will have been sleeping by this time tomorrow.' }
        ]
    },
    {
        id: 11,
        name: 'Future Perfect Continuous',
        turkish: 'Gelecek Devamlı Tamamlanmışı',
        formula: 'will + have + been + V-ing',
        timeline: { past: 'gray', present: 'gray', future: 'green-arc-right' },
        diagram: 'Past ---- Present ---- Future (===X===) ---- Future\n(Will have been: You will have been studying)',
        rule: 'Gelecekte belirli zamana kadar ne kadar süredir devam edecek',
        examples: [
            { en: 'By Friday, I will have been studying for 6 months.', tr: 'Cuma günü 6 aydır çalışmış olacağım.' },
            { en: 'She will have been working.', tr: 'O çalışmış olacak.' },
            { en: 'They will have been living here.', tr: 'Onlar burada yaşamış olacaklar.' }
        ],
        quiz: [
            { q: 'Türkçe: "Yıl sonunda 5 yıl burada olacağız."', a: 'By the end of the year, we will have been here for 5 years.' }

    }
];

// ════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════

let currentTenseIndex = -1;
let correct = 0;
let wrong = 0;
let streak = 0;
let currentQuizIndex = {};

TENSES.forEach(t => currentQuizIndex[t.id] = 0);

// ════════════════════════════════════════════════════════════════════════
// TIMELINE VISUALIZATION
// ════════════════════════════════════════════════════════════════════════

function createSmallTimeline(timelineType) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 300 80');
    svg.setAttribute('style', 'width: 100%; height: 80px;');

    // Line
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', '20');
    line.setAttribute('y1', '40');
    line.setAttribute('x2', '280');
    line.setAttribute('y2', '40');
    line.setAttribute('stroke', '#ccc');
    line.setAttribute('stroke-width', '2');
    svg.appendChild(line);

    // Points & Arcs based on type
    if (timelineType.present === 'blue-dots') {
        // Simple Present: many dots at present
        for (let i = 0; i < 5; i++) {
            const x = 140 + (i - 2) * 15;
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', x);
            dot.setAttribute('cy', '40');
            dot.setAttribute('r', '4');
            dot.setAttribute('fill', '#3b82f6');
            svg.appendChild(dot);
        }
    }

    if (timelineType.present === 'red-arc') {
        // Present/Past Continuous: arc at present
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M 100 40 Q 140 10, 180 40');
        path.setAttribute('stroke', '#ef4444');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-dasharray', '5,5');
        svg.appendChild(path);
    }

    if (timelineType.present === 'yellow-circle') {
        // Present Perfect
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '140');
        circle.setAttribute('cy', '40');
        circle.setAttribute('r', '6');
        circle.setAttribute('fill', '#f59e0b');
        svg.appendChild(circle);
        
        const pathBg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathBg.setAttribute('d', 'M 40 40 Q 90 20, 140 40');
        pathBg.setAttribute('stroke', '#f59e0b');
        pathBg.setAttribute('stroke-width', '2');
        pathBg.setAttribute('fill', 'none');
        pathBg.setAttribute('opacity', '0.3');
        svg.appendChild(pathBg);
    }

    if (timelineType.present === 'green-circle') {
        // Present Perfect Continuous
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '140');
        circle.setAttribute('cy', '40');
        circle.setAttribute('r', '6');
        circle.setAttribute('fill', '#10b981');
        svg.appendChild(circle);
        
        const pathBg = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        pathBg.setAttribute('d', 'M 20 40 Q 80 15, 140 40');
        pathBg.setAttribute('stroke', '#10b981');
        pathBg.setAttribute('stroke-width', '3');
        pathBg.setAttribute('fill', 'none');
        pathBg.setAttribute('opacity', '0.4');
        svg.appendChild(pathBg);
    }

    if (timelineType.past === 'blue-point') {
        // Simple Past: point at past
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', '80');
        dot.setAttribute('cy', '40');
        dot.setAttribute('r', '5');
        dot.setAttribute('fill', '#3b82f6');
        svg.appendChild(dot);
    }

    if (timelineType.future === 'blue-dots') {
        // Simple Future
        for (let i = 0; i < 5; i++) {
            const x = 200 + i * 15;
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', x);
            dot.setAttribute('cy', '40');
            dot.setAttribute('r', '4');
            dot.setAttribute('fill', '#3b82f6');
            svg.appendChild(dot);
        }
    }

    if (timelineType.future === 'red-arc') {
        // Future Continuous
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M 180 40 Q 220 10, 260 40');
        path.setAttribute('stroke', '#ef4444');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-dasharray', '5,5');
        svg.appendChild(path);
    }

    // Labels
    const labels = ['Past', 'Present', 'Future'];
    const positions = [40, 140, 240];
    labels.forEach((label, i) => {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', positions[i]);
        text.setAttribute('y', '70');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '11');
        text.setAttribute('fill', '#64748b');
        text.setAttribute('font-weight', '500');
        text.textContent = label;
        svg.appendChild(text);
    });

    return svg;
}

function createBigTimeline(tense) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 400 120');
    svg.setAttribute('style', 'width: 100%; height: 150px;');

    // Main line
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', '40');
    line.setAttribute('y1', '60');
    line.setAttribute('x2', '360');
    line.setAttribute('y2', '60');
    line.setAttribute('stroke', '#ddd');
    line.setAttribute('stroke-width', '3');
    svg.appendChild(line);

    // Determine colors
    let pastColor = '#64748b';
    let presentColor = '#3b82f6';
    let futureColor = '#64748b';

    if (tense.timeline.past.includes('blue')) pastColor = '#3b82f6';
    if (tense.timeline.past.includes('yellow')) pastColor = '#f59e0b';
    if (tense.timeline.past.includes('green')) pastColor = '#10b981';
    if (tense.timeline.past.includes('red')) pastColor = '#ef4444';

    if (tense.timeline.present.includes('blue')) presentColor = '#3b82f6';
    if (tense.timeline.present.includes('yellow')) presentColor = '#f59e0b';
    if (tense.timeline.present.includes('green')) presentColor = '#10b981';
    if (tense.timeline.present.includes('red')) presentColor = '#ef4444';

    if (tense.timeline.future.includes('blue')) futureColor = '#3b82f6';
    if (tense.timeline.future.includes('yellow')) futureColor = '#f59e0b';
    if (tense.timeline.future.includes('green')) futureColor = '#10b981';
    if (tense.timeline.future.includes('red')) futureColor = '#ef4444';

    // Points
    const points = [
        { x: 80, label: 'Past', color: pastColor },
        { x: 200, label: 'Present', color: presentColor },
        { x: 320, label: 'Future', color: futureColor }
    ];

    points.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', '60');
        circle.setAttribute('r', '8');
        circle.setAttribute('fill', p.color);
        svg.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', p.x);
        text.setAttribute('y', '100');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '13');
        text.setAttribute('font-weight', '600');
        text.setAttribute('fill', '#1e293b');
        text.textContent = p.label;
        svg.appendChild(text);
    });

    return svg;
}

// ════════════════════════════════════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════════════════════════════════════

function renderTensesGrid() {
    const grid = document.getElementById('tenses-grid');
    grid.innerHTML = '';

    TENSES.forEach((tense, idx) => {
        const card = document.createElement('div');
        card.className = `tense-card ${idx === 0 ? 'active' : ''}`;
        card.onclick = () => selectTense(idx);

        card.innerHTML = `
            <div class="tense-title">${tense.name}</div>
            <div class="tense-subtitle">${tense.turkish}</div>
            <div class="tense-structure">${tense.formula.replace(/\|/g, '<br>')}</div>
            <div class="timeline-visual" id="timeline-${idx}"></div>
        `;

        grid.appendChild(card);

        // Add timeline SVG
        const timelineContainer = card.querySelector(`#timeline-${idx}`);
        timelineContainer.appendChild(createSmallTimeline(tense.timeline));
    });
}

function selectTense(idx) {
    currentTenseIndex = idx;
    document.querySelectorAll('.tense-card').forEach((card, i) => {
        card.classList.toggle('active', i === idx);
    });
    renderDetailView(idx);
}

function renderDetailView(idx) {
    const tense = TENSES[idx];
    const detail = document.getElementById('detail-view');

    let examplesHtml = '';
    tense.examples.forEach(ex => {
        examplesHtml += `
            <div class="example-block">
                <strong>${ex.en}</strong>
                <div class="tr">${ex.tr}</div>
            </div>
        `;
    });

    const quiz = tense.quiz[currentQuizIndex[idx] || 0];

    detail.innerHTML = `
        <div class="detail-header">
            <div class="detail-title">${tense.name}</div>
            <div class="detail-subtitle">${tense.turkish} — ${tense.rule}</div>
        </div>

        <div class="formula-box">
            <strong>Formula:</strong><br>
            ${tense.formula.replace(/\|/g, '<br>')}
        </div>

        <div class="big-diagram">
            <strong style="font-size: 14px; display: block; margin-bottom: 15px;">Timeline Görselleştirmesi</strong>
        </div>
        <div id="big-timeline-container"></div>

        <div class="big-diagram">
            <strong style="font-size: 14px; display: block; margin-bottom: 10px;">Açıklama</strong>
            <div style="text-align: left; font-size: 13px; color: var(--text-muted); line-height: 1.8;">
                ${tense.diagram.replace(/\n/g, '<br>')}
            </div>
        </div>

        <div class="examples-section">
            <div class="examples-title">Örnek Cümleler</div>
            ${examplesHtml}
        </div>

        <div class="quiz-section">
            <div class="quiz-title">✎ Senin Sıran — Çevir!</div>
            <div class="quiz-item">
                <div class="quiz-question">${quiz.q}</div>
                <input type="text" class="quiz-input" id="quiz-answer" placeholder="İngilizce çeviri..." onkeypress="if(event.key==='Enter') checkQuiz()">
                <div class="quiz-buttons">
                    <button class="btn-check" onclick="checkQuiz()">Kontrol Et</button>
                    <button class="btn-skip" onclick="skipQuiz()">Geç</button>
                </div>
                <div class="feedback" id="quiz-feedback"></div>
            </div>
        </div>
    `;

    // Add big timeline
    const bigTimelineContainer = detail.querySelector('#big-timeline-container');
    bigTimelineContainer.appendChild(createBigTimeline(tense));

    detail.classList.add('show');
    window.scrollTo({ top: detail.offsetTop - 100, behavior: 'smooth' });
}

function checkQuiz() {
    const answer = document.getElementById('quiz-answer').value.trim().toLowerCase();
    const tense = TENSES[currentTenseIndex];
    const quiz = tense.quiz[currentQuizIndex[currentTenseIndex] || 0];
    const correctAnswer = quiz.a.toLowerCase();

    const feedback = document.getElementById('quiz-feedback');

    if (answer === correctAnswer || levenshteinDistance(answer, correctAnswer) < 3) {
        feedback.className = 'feedback correct show';
        feedback.innerHTML = `<strong>✓ Doğru!</strong> Harika!`;
        correct++;
        streak++;
    } else {
        feedback.className = 'feedback incorrect show';
        feedback.innerHTML = `
            <strong>✗ Yanlış</strong>
            <div style="margin-top: 8px; font-size: 12px;">
                Doğru cevap: <strong>${quiz.a}</strong>
            </div>
        `;
        wrong++;
        streak = 0;
    }

    updateStats();
    document.getElementById('quiz-answer').disabled = true;

    setTimeout(() => {
        currentQuizIndex[currentTenseIndex] = (currentQuizIndex[currentTenseIndex] || 0 + 1) % TENSES[currentTenseIndex].quiz.length;
        renderDetailView(currentTenseIndex);
    }, 2000);
}

function skipQuiz() {
    currentQuizIndex[currentTenseIndex] = (currentQuizIndex[currentTenseIndex] || 0) + 1;
    if (currentQuizIndex[currentTenseIndex] >= TENSES[currentTenseIndex].quiz.length) {
        currentQuizIndex[currentTenseIndex] = 0;
    }
    renderDetailView(currentTenseIndex);
}

function updateStats() {
    document.getElementById('correct').textContent = correct;
    document.getElementById('wrong').textContent = wrong;
    document.getElementById('streak').textContent = streak;
}

// Simple string distance
function levenshteinDistance(a, b) {
    const matrix = [];
    for (let i = 0; i <= b.length; i++) {
        matrix[i] = [i];
    }
    for (let j = 0; j <= a.length; j++) {
        matrix[0][j] = j;
    }
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j] + 1
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

// ════════════════════════════════════════════════════════════════════════

renderTensesGrid();
selectTense(0);
</script>
