<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro English Teacher — 12 Tense Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #dbeafe;
            --success: #059669;
            --warning: #d97706;
            --error: #dc2626;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        .logo {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 15px;
            opacity: 0.8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* STATS BAR */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-box {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            background: var(--bg);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* MAIN GRID */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* LEFT SIDEBAR - TENSE SELECTOR */
        .sidebar {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .tense-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .tense-option {
            padding: 12px 15px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 13px;
            font-weight: 500;
        }

        .tense-option:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            transform: translateX(4px);
        }

        .tense-option.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tense-name {
            font-weight: 700;
            display: block;
        }

        .tense-code {
            font-size: 11px;
            opacity: 0.7;
            font-family: 'IBM Plex Mono', monospace;
            display: block;
            margin-top: 2px;
        }

        /* RIGHT PANEL - LESSON */
        .lesson-panel {
            background: var(--card);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .lesson-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .tense-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .tense-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .rule-statement {
            background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
        }

        .rule-statement strong {
            color: var(--primary-dark);
        }

        /* TIMELINE DIAGRAM */
        .timeline-diagram {
            background: var(--bg);
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            border: 2px dashed var(--border);
            text-align: center;
        }

        .timeline-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .timeline-svg {
            width: 100%;
            max-width: 100%;
        }

        /* FORMULA BOX */
        .formula-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .formula-item {
            background: var(--bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid var(--primary);
        }

        .formula-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .formula-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--primary-dark);
            line-height: 1.6;
        }

        /* EXAMPLES SECTION */
        .examples-section {
            margin: 30px 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .example-cards {
            display: grid;
            gap: 12px;
        }

        .example-card {
            background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid var(--primary);
        }

        .example-en {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--primary-dark);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .example-tr {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-style: italic;
        }

        .example-note {
            font-size: 11px;
            background: white;
            padding: 6px 8px;
            border-radius: 4px;
            color: #666;
            border-left: 2px solid var(--warning);
        }

        /* PRACTICE SECTION */
        .practice-section {
            background: linear-gradient(135deg, #fef3c7 0%, #fef08a 100%);
            border: 2px solid var(--warning);
            border-radius: 12px;
            padding: 25px;
            margin: 30px 0;
        }

        .practice-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .practice-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--warning);
        }

        .practice-content {
            display: grid;
            gap: 15px;
        }

        .practice-mode {
            display: none;
        }

        .practice-mode.active {
            display: block;
        }

        .practice-step {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #fed7aa;
        }

        .step-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--warning);
            margin-bottom: 10px;
        }

        .step-text {
            font-size: 13px;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.6;
        }

        /* INPUT AREA */
        textarea, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text);
            background: white;
            transition: all 0.3s;
            resize: none;
            min-height: 60px;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            font-style: italic;
        }

        /* BUTTONS */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* FEEDBACK */
        .feedback-box {
            display: none;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            animation: slideIn 0.4s ease;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct {
            background: #dcfce7;
            border: 2px solid #86efac;
        }

        .feedback-box.incorrect {
            background: #fee2e2;
            border: 2px solid #fca5a5;
        }

        .feedback-box.partial {
            background: #fef3c7;
            border: 2px solid #fcd34d;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .feedback-box.correct .feedback-header {
            color: var(--success);
        }

        .feedback-box.incorrect .feedback-header {
            color: var(--error);
        }

        .feedback-box.partial .feedback-header {
            color: var(--warning);
        }

        .feedback-icon {
            font-size: 20px;
        }

        .feedback-content {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text);
        }

        .correct-answer-box {
            background: white;
            border-left: 3px solid var(--success);
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--primary-dark);
        }

        .error-analysis {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 12px 0;
        }

        .error-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            line-height: 1.6;
        }

        .error-item:last-child {
            border-bottom: none;
        }

        .error-label {
            display: inline-block;
            background: var(--error);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            margin-right: 8px;
            text-transform: uppercase;
        }

        .error-label.missing {
            background: #f59e0b;
        }

        .error-label.grammar {
            background: var(--error);
        }

        .error-label.vocab {
            background: #8b5cf6;
        }

        .error-explanation {
            margin-top: 8px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            line-height: 1.6;
        }

        .tips-box {
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
            border-left: 3px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text);
            line-height: 1.6;
        }

        .tips-box strong {
            color: var(--primary-dark);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .motivational {
            padding: 15px;
            background: linear-gradient(135deg, #d1fae5 0%, #e0f2fe 100%);
            border-radius: 8px;
            font-size: 13px;
            font-style: italic;
            color: var(--text);
            margin: 15px 0;
            border-left: 3px solid var(--success);
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .lesson-panel {
                padding: 20px;
            }
            .tense-title {
                font-size: 24px;
            }
        }

        /* LOADING */
        .loading {
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
            margin: 15px 0;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <div class="logo">🎓 Pro English Teacher</div>
        <div class="tagline">12 Zaman Yapısı — Profesyonel Eğitim Sistemi</div>
    </header>

    <!-- STATS -->
    <div class="stats-bar">
        <div class="stat-box">
            <div class="stat-value" id="stat-correct">0</div>
            <div class="stat-label">✓ Doğru</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-wrong">0</div>
            <div class="stat-label">✗ Yanlış</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-streak">0</div>
            <div class="stat-label">🔥 Seri</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="stat-accuracy">0%</div>
            <div class="stat-label">📊 Başarı</div>
        </div>
    </div>

    <!-- MAIN GRID -->
    <div class="main-grid">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-title">⏰ Zaman Seç</div>
            <div class="tense-grid" id="tense-grid"></div>
        </div>

        <!-- LESSON PANEL -->
        <div class="lesson-panel">
            <div id="lesson-content"></div>
        </div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════
// PROFESSIONAL DATABASE
// ═══════════════════════════════════════════════════════���════════════════

const TENSES_DB = [
    {
        id: 0,
        name: 'Simple Present',
        code: 'V / V+s',
        turkish: 'Basit Şimdiki Zaman',
        rule: 'Bir kişinin her gün yaptığı işler, sabit gerçekler veya değişmeyen durumlardır. Zamanla ilgisi olmayan genel doğrulardır.',
        formula: [
            { label: 'Pozitif', text: 'I/You/We/They + V\nHe/She/It + V+s' },
            { label: 'Negatif', text: 'do/does + not + V' },
            { label: 'Soru', text: 'Do/Does + subject + V?' }

                en: 'I eat breakfast at 7 AM every day.',

            {

            },
            {
                en: 'They play football on Sundays.',
                tr: 'Onlar pazarları futbol oynarlar.'
            }

        commonMistakes: [
            { wrong: 'I goes to school', right: 'I go to school', reason: 'I ile beraber "s" takısı EKLENMEZ' },
            { wrong: 'She go to school', right: 'She goes to school', reason: 'She (3. tekil) ile her zaman V+s' },
            { wrong: 'They plays football', right: 'They play football', reason: 'They (çoğul) ile "s" takısı YOK' }
        ]
    },
    {
        id: 1,
        name: 'Present Continuous',
        code: 'am/is/are + V-ing',
        turkish: 'Şu Anki Devamlı Zaman',
        rule: 'Konuşmanın yapıldığı tam şu anda, gerçekleşmekte olan eylemleri anlatır. Durum şu anda devam ediyor.',
        formula: [
            { label: 'Yapısı', text: 'am/is/are + V-ing\nI am | He/She/It is | You/We/They are' },
            { label: 'Negatif', text: 'am/is/are + not + V-ing' },
            { label: 'Soru', text: 'Is/Are + subject + V-ing?' }
        ],
        timeline: 'present-arc',
        usage: 'Şu anda yapılmakta olan işler, bu dönem geçici durumlar',
        examples: [
            {
                en: 'I am reading a book right now.',
                tr: 'Ben şu anda bir kitap okuyorum.'
            },
            {
                en: 'She is studying for her exam.',

            },
            {
                en: 'They are playing football in the park.',

            }
        ],
        commonMistakes: [
            { wrong: 'I am read a book', right: 'I am reading a book', reason: 'am/is/are SONRA -ing hali gelir' },
            { wrong: 'She is study', right: 'She is studying', reason: 'study → studying (y\'yi i\'ye çevir ve ing ekle)' },
            { wrong: 'They are playing football', right: 'They are playing football', reason: 'Bu zaten doğru! ✓' }
        ]
    },
    {
        id: 2,
        name: 'Simple Past',
        code: 'V-ed / V-changed',
        turkish: 'Geçmiş Zaman',
        rule: 'Geçmişte başlayıp biten, artık tamamlanmış bir eylemi anlatır. Belirli bir zaman göstergesi (dün, geçen ay) gerekir.',

            { label: 'Düzenli Fiil', text: 'V + -ed\nplay → played\nstudy → studied' },
            { label: 'Düzensiz Fiil', text: 'go → went\nbe → was/were\neat → ate' },
            { label: 'Soru/Olumsuz', text: 'Did + subject + V\nDid not + V' }

        commonMistakes: [

    },
    {
        id: 3,
        name: 'Past Continuous',
        code: 'was/were + V-ing',
        turkish: 'Geçmiş Devamlı Zaman',

        ]
    },
    {
        id: 4,
        name: 'Present Perfect',
        code: 'have/has + Past Participle',
        turkish: 'Şimdiki Zaman Tamamlanmışı',

        formula: [
            { label: 'Yapısı', text: 'have/has + Past Participle\nI/You/We/They have eaten\nHe/She/It has eaten' },
            { label: 'Negatif', text: 'have/has + not + PP' },
            { label: 'Soru', text: 'Have/Has + subject + PP?' }

        timeline: 'present-yellow-arc',
        usage: 'Yakın geçmiş + şimdiki etkisi, hayatta ilk defa, henüz tamamlanmayan işler',
        examples: [
            {
                en: 'I have finished my homework.',
                tr: 'Ben ödevimi bitirdim (etkisi henüz var).'
            },
            {

                tr: 'O hiç Paris\'e gitmedi (hayatı boyunca).'
            },

function init() {

function renderTenseGrid() {
    const grid = document.getElementById('tense-grid');
    grid.innerHTML = '';

    TENSES_DB.forEach((tense, idx) => {
        const btn = document.createElement('button');
        btn.className = `tense-option ${idx === 0 ? 'active' : ''}`;
        btn.innerHTML = `
            <span class="tense-name">${tense.name}</span>
            <span class="tense-code">${tense.code}</span>
        `;
        btn.onclick = () => switchTense(idx);
        grid.appendChild(btn);
    });
}

function switchTense(idx) {
    currentTenseId = idx;
    document.querySelectorAll('.tense-option').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
    });
    renderLesson(idx);
}

function createTimeline(type) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 400 100');
    svg.setAttribute('style', 'width: 100%; height: 120px;');

    // Main timeline line
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', '30');
    line.setAttribute('y1', '50');
    line.setAttribute('x2', '370');
    line.setAttribute('y2', '50');
    line.setAttribute('stroke', '#cbd5e1');
    line.setAttribute('stroke-width', '2');
    svg.appendChild(line);

    // Timeline points
    const points = [
        { x: 80, label: 'PAST', color: '#64748b' },
        { x: 200, label: 'NOW', color: '#2563eb' },
        { x: 320, label: 'FUTURE', color: '#64748b' }
    ];

    points.forEach(p => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', p.x);
        circle.setAttribute('cy', '50');
        circle.setAttribute('r', '6');
        circle.setAttribute('fill', p.color);
        svg.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', p.x);
        text.setAttribute('y', '80');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '12');
        text.setAttribute('font-weight', '600');
        text.setAttribute('fill', '#475569');
        text.textContent = p.label;
        svg.appendChild(text);
    });

    // Add specific visualization based on type
    if (type.includes('dots')) {
        // Multiple dots for present/future dots
        const zone = type.includes('present') ? 180 : 300;
        for (let i = 0; i < 3; i++) {
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', zone + i * 20 - 20);
            dot.setAttribute('cy', '50');
            dot.setAttribute('r', '3');
            dot.setAttribute('fill', '#2563eb');
            svg.appendChild(dot);
        }
    }

    if (type.includes('arc')) {
        // Arc for continuous tenses
        const pathX = type.includes('present') ? 140 : type.includes('future') ? 260 : 120;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${pathX} 50 Q ${pathX + 30} 20, ${pathX + 60} 50`);
        path.setAttribute('stroke', '#ef4444');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-dasharray', '4,2');
        svg.appendChild(path);
    }

    return svg;
}

function generatePracticeSentences(tense) {

    const randomTense = TENSES_DB[Math.floor(Math.random() * TENSES_DB.length)];

    document.getElementById('identify-sentence').textContent = identifySentence.en;

    // Build mode - current tense example
    const buildSentence = tense.examples[Math.floor(Math.random() * tense.examples.length)];
    document.getElementById('build-tr-sentence').textContent = buildSentence.tr;
    currentSentence = buildSentence;
}

function switchMode(mode) {

    } else if (mode === 'build') {

    }
}

        </div>
        <div class="error-analysis">
            <strong style="display: block; margin-bottom: 10px;">🎯 Nasıl Çalışıyor?</strong>
            <div class="error-item">
                <strong>Formula:</strong> ${tense.formula[0].text.split('<br>')[0]}
            </div>
            <div class="error-item">
                <strong>Neden?</strong> ${tense.rule}
            </div>
        </div>
        <div class="motivational">
            🌟 Bu yapıyı anladın! Şimdi sende yazma zamanı geldi. Geç butonuna tıkla.
        </div>
    `;
}

function identifyTense() {
    const answer = document.getElementById('identify-answer').value.trim().toLowerCase();
    const identifySentenceText = document.getElementById('identify-sentence').textContent;
    
    // Find which tense this sentence belongs to
    let correctTense = null;
    for (let tense of TENSES_DB) {
        if (tense.examples.some(ex => ex.en.toLowerCase() === identifySentenceText.toLowerCase())) {
            correctTense = tense;
            break;
        }
    }

    if (!correctTense) {
        correctTense = TENSES_DB[Math.floor(Math.random() * TENSES_DB.length)];
    }

    const feedback = document.getElementById('feedback-identify');
    const answerLower = answer.toLowerCase().replace(/ /g, '');
    const correctLower = correctTense.name.toLowerCase().replace(/ /g, '');

    if (answerLower === correctLower) {
        feedback.className = 'feedback-box correct show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span class="feedback-icon">✅</span>
                <span>MÜKEMMEL! Doğru tanıdın!</span>
            </div>
            <div class="correct-answer-box">
                <strong>Cümle:</strong> "${identifySentenceText}"
                <br><strong>Zaman:</strong> ${correctTense.name} (${correctTense.code})
            </div>
            <div class="error-analysis">
                <strong style="display: block; margin-bottom: 10px;">Nasıl Anladın?</strong>
                <div class="error-item">
                    ${correctTense.rule}
                </div>
            </div>
        `;
        stats.correct++;
        stats.streak++;
    } else {
        feedback.className = 'feedback-box incorrect show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span class="feedback-icon">❌</span>
                <span>Bir daha deneyin!</span>
            </div>
            <div class="correct-answer-box">
                <strong>Cümle:</strong> "${identifySentenceText}"
                <br><strong>Doğru Cevap:</strong> ${correctTense.name} (${correctTense.code})
            </div>
            <div class="error-explanation">
                <strong>Neden ${correctTense.name}?</strong><br>
                ${correctTense.rule}
                <br><br>
                <strong>Formula:</strong> ${correctTense.formula[0].text.split('<br>')[0]}
            </div>
        `;
        stats.wrong++;
        stats.streak = 0;
    }

    stats.total++;
    updateStats();
}

function checkBuilt() {
    const userAnswer = document.getElementById('build-answer').value.trim();
    const tense = TENSES_DB[currentTenseId];
    const feedback = document.getElementById('feedback-build');

    if (!userAnswer) {
        alert('Lütfen bir cümle yazınız!');
        return;
    }

    // Simple similarity check
    const correctAnswer = currentSentence.en.toLowerCase();
    const userLower = userAnswer.toLowerCase();
    
    const words = correctAnswer.split(' ');
    const userWords = userAnswer.split(' ');
    const matchedWords = userWords.filter(w => correctAnswer.includes(w)).length;
    const similarity = matchedWords / Math.max(words.length, userWords.length);

    if (similarity > 0.75) {
        // CORRECT
        feedback.className = 'feedback-box correct show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span class="feedback-icon">🎉</span>
                <span>HARIKA! Tam doğru yazdın!</span>
            </div>
            <div class="correct-answer-box">
                <strong>Senin Cevab:</strong> "${userAnswer}"
                <br><strong>Doğru Cevap:</strong> "${currentSentence.en}"
            </div>
            <div class="motivational">
                ⭐ ${tense.name} yapısını TAMAMEN anlamışsın! Seni tebrik ediyorum!
            </div>
        `;
        stats.correct++;
        stats.streak++;
    } else if (similarity > 0.5) {
        // PARTIAL
        feedback.className = 'feedback-box partial show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span class="feedback-icon">🤔</span>
                <span>Yakın! Ama biraz düzelt.</span>
            </div>
            <div class="correct-answer-box">
                <strong>Doğru Cevap:</strong> "${currentSentence.en}"
            </div>
            <div class="error-analysis">
                <strong style="display: block; margin-bottom: 10px;">Düzeltme Noktaları:</strong>
                ${generateDetailedFeedback(userAnswer, currentSentence.en, tense)}
            </div>
            <div class="tips-box">
                <strong>İpucu:</strong> ${tense.formula[0].text.split('<br>')[0]} yapısını kontrol et!
            </div>
        `;
        stats.wrong++;
        stats.streak = 0;
    } else {
        // WRONG
        feedback.className = 'feedback-box incorrect show';
        feedback.innerHTML = `
            <div class="feedback-header">
                <span class="feedback-icon">❌</span>
                <span>Henüz tam doğru değil. Bir daha dene!</span>
            </div>
            <div class="correct-answer-box">
                <strong>Senin Cevap:</strong> "${userAnswer}"
                <br><strong>Doğru Cevap:</strong> "${currentSentence.en}"
            </div>
            <div class="error-analysis">
                <strong style="display: block; margin-bottom: 10px;">Hatalar:</strong>
                ${generateDetailedFeedback(userAnswer, currentSentence.en, tense)}
            </div>
            <div class="tips-box">
                <strong>Hatırla:</strong> ${tense.rule}
            </div>
        `;
        stats.wrong++;
        stats.streak = 0;
    }

    stats.total++;
    updateStats();
}

function generateDetailedFeedback(userAnswer, correctAnswer, tense) {
    const mistakes = tense.commonMistakes || [];
    
    let feedback = '';
    mistakes.forEach(m => {
        if (userAnswer.includes(m.wrong)) {
            feedback += `
                <div class="error-item">
                    <span class="error-label grammar">HATA</span>
                    <strong>Yanlış:</strong> "${m.wrong}"
                    <br>
                    <strong>Doğru:</strong> "${m.right}"
                    <br>
                    <div class="error-explanation">
                        <strong>Açıklama:</strong> ${m.reason}
                    </div>
                </div>
            `;
        }
    });

    if (!feedback) {
        feedback = `
            <div class="error-item">
                <span class="error-label missing">EKSİK VEYA HAVAL</span>
                <div class="error-explanation">
                    <strong>Formula:</strong> ${tense.formula[0].text.split('<br>')[0]}
                    <br><br>
                    <strong>Açıklama:</strong> ${tense.rule}
                </div>
            </div>
        `;
    }

    return feedback;
}

function resetPractice() {
    document.getElementById('user-sentence').value = '';
    document.getElementById('identify-answer').value = '';
    document.getElementById('build-answer').value = '';
    document.querySelectorAll('.feedback-box').forEach(fb => fb.classList.remove('show'));
    switchMode('choose');
}

function updateStats() {
    document.getElementById('stat-correct').textContent = stats.correct;
    document.getElementById('stat-wrong').textContent = stats.wrong;
    document.getElementById('stat-streak').textContent = stats.streak;
    
    const accuracy = stats.total > 0 
        ? Math.round((stats.correct / stats.total) * 100) 
        : 0;
    document.getElementById('stat-accuracy').textContent = accuracy + '%';
}
