<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro English Grammar Academy — AI Powered</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #0d1117;
            --ink2: #1c2333;
            --ink3: #2d3748;
            --blue: #3b82f6;
            --blue-dim: #1d4ed8;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --muted: #94a3b8;
            --border: #1e2d3d;
            --surface: #161b27;
            --surface2: #1a2236;
            --text: #e2e8f0;
            --text2: #94a3b8;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--ink);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BG GRID */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 1380px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ── HEADER ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text2);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ai-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.15));
            border: 1px solid rgba(59,130,246,0.3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--cyan);
            letter-spacing: 0.5px;
        }

        .ai-dot {
            width: 6px; height: 6px;
            background: var(--cyan);
            border-radius: 50%;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* ── STATS ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            font-size: 22px;
            line-height: 1;
        }

        .stat-val {
            font-size: 28px;
            font-weight: 800;
            color: var(--blue);
            line-height: 1;
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 2px;
        }

        /* ── LAYOUT ── */
        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar-head {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text2);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .tense-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 9px 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            font-family: 'Syne', sans-serif;
            color: var(--text2);
        }

        .tense-btn:hover {
            background: var(--surface2);
            border-color: var(--border);
            color: var(--text);
        }

        .tense-btn.active {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.1));
            border-color: rgba(59,130,246,0.4);
            color: var(--blue);
        }

        .tb-name {
            font-size: 12px;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        .tb-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            opacity: 0.6;
        }

        /* ── MAIN PANEL ── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }

        .lesson-top {
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 1px solid var(--border);
        }

        .tense-name-big {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #e2e8f0, var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .tense-tr {
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 14px;
        }

        .rule-box {
            background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(6,182,212,0.08));
            border: 1px solid rgba(59,130,246,0.2);
            border-left: 3px solid var(--blue);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text);
        }

        /* ── TIMELINE ── */
        .timeline-wrap {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .tl-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text2);
            margin-bottom: 12px;
        }

        /* ── FORMULA CARDS ── */
        .formula-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .formula-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .fc-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--cyan);
            margin-bottom: 8px;
        }

        .fc-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text);
            line-height: 1.6;
        }

        /* ── COLLAPSIBLE ── */
        .coll {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .coll-head {
            padding: 12px 16px;
            background: var(--ink2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text2);
            user-select: none;
            transition: background 0.2s;
        }

        .coll-head:hover { background: var(--surface2); }

        .coll-arrow { transition: transform 0.25s; }

        .coll-body {
            display: none;
            padding: 16px;
            background: var(--surface);
        }

        .coll-body.open { display: block; }
        .coll-arrow.open { transform: rotate(180deg); }

        .example-item {
            background: var(--ink2);
            border-left: 3px solid var(--blue);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .ex-en {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--cyan);
            font-weight: 600;
            margin-bottom: 3px;
        }

        .ex-tr {
            font-size: 11px;
            color: var(--text2);
        }

        .mistake-item {
            background: var(--ink2);
            border-left: 3px solid var(--rose);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .mis-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .mis-wrong {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--rose);
            text-decoration: line-through;
        }

        .mis-right {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--emerald);
            background: rgba(16,185,129,0.1);
            padding: 1px 7px;
            border-radius: 4px;
        }

        .mis-exp {
            font-size: 11px;
            color: var(--text2);
        }

        /* ── PRACTICE ── */
        .practice-wrap {
            margin-top: 28px;
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .practice-head {
            padding: 18px 24px;
            background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(244,63,94,0.08));
            border-bottom: 1px solid var(--border);
        }

        .ph-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--amber);
            margin-bottom: 3px;
        }

        .ph-sub {
            font-size: 11px;
            color: var(--text2);
            line-height: 1.6;
        }

        .tab-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--ink);
        }

        .tab {
            padding: 13px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            transition: all 0.2s;
        }

        .tab:hover { color: var(--amber); }

        .tab.active {
            color: var(--amber);
            border-bottom-color: var(--amber);
        }

        .tab-panel {
            display: none;
            padding: 24px;
        }

        .tab-panel.active { display: block; }

        /* ── FORM ELEMENTS ── */
        .field-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text2);
            margin-bottom: 8px;
        }

        .field-desc {
            font-size: 12px;
            color: var(--text2);
            line-height: 1.7;
            margin-bottom: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--ink);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text);
            resize: none;
            transition: border-color 0.2s;
            min-height: 60px;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-ai {
            flex: 1;
            padding: 11px 18px;
            background: linear-gradient(135deg, var(--blue), var(--blue-dim));
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .btn-ai:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-sec {
            padding: 11px 16px;
            background: transparent;
            color: var(--text2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sec:hover {
            border-color: var(--text2);
            color: var(--text);
        }

        /* ── CHOICE BUTTONS ── */
        .choice-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .choice {
            padding: 13px;
            background: var(--ink);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 12px;
            color: var(--text2);
            transition: all 0.2s;
            text-align: center;
        }

        .choice:hover { border-color: var(--blue); color: var(--text); }

        .choice.selected {
            background: rgba(59,130,246,0.15);
            border-color: var(--blue);
            color: var(--blue);
        }

        /* ── DISPLAY BOX ── */
        .display-box {
            background: var(--ink);
            border: 1px solid var(--border);
            border-left: 3px solid var(--cyan);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--cyan);
            margin: 12px 0;
            line-height: 1.6;
        }

        /* ── LOADING ── */
        .ai-loading {
            display: none;
            padding: 20px;
            text-align: center;
        }

        .ai-loading.show { display: block; }

        .ai-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text2);
            font-size: 12px;
        }

        .dots span {
            display: inline-block;
            width: 6px; height: 6px;
            background: var(--blue);
            border-radius: 50%;
            animation: bounce 1.2s ease-in-out infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ── FEEDBACK ── */
        .feedback {
            display: none;
            margin-top: 16px;
            border-radius: 10px;
            padding: 18px;
            animation: fadeUp 0.35s ease;
        }

        .feedback.show { display: block; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.ok {
            background: rgba(16,185,129,0.08);
            border: 1px solid rgba(16,185,129,0.3);
        }

        .feedback.err {
            background: rgba(244,63,94,0.08);
            border: 1px solid rgba(244,63,94,0.3);
        }

        .fb-head {
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback.ok .fb-head { color: var(--emerald); }
        .feedback.err .fb-head { color: var(--rose); }

        .fb-body {
            font-size: 12px;
            line-height: 1.8;
            color: var(--text2);
        }

        .fb-body strong { color: var(--text); }

        .fb-body .correct-ans {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--emerald);
            background: rgba(16,185,129,0.1);
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            display: block;
        }

        /* ── STAGE 2 HIDDEN ── */
        #identify-s2 { display: none; }

        /* ── RESPONSIVE ── */
        @media (max-width: 1024px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }

        @media (max-width: 640px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .formula-grid { grid-template-columns: 1fr; }
            .choice-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="wrap">

    <!-- HEADER -->
    <header>
        <div class="brand">
            <div class="brand-icon">🎓</div>
            <div>
                <div class="brand-name">Grammar Academy</div>
                <div class="brand-sub">12 Tenses · AI Powered</div>
            </div>
        </div>
        <div class="ai-badge">
            <div class="ai-dot"></div>
            Claude AI Aktif
        </div>
    </header>

    <!-- STATS -->
    <div class="stats-row">
        <div class="stat">
            <div class="stat-icon">✓</div>
            <div>
                <div class="stat-val" id="s-correct">0</div>
                <div class="stat-lbl">Doğru</div>
            </div>
        </div>
        <div class="stat">
            <div class="stat-icon">✗</div>
            <div>
                <div class="stat-val" id="s-wrong" style="color: var(--rose)">0</div>
                <div class="stat-lbl">Yanlış</div>
            </div>
        </div>
        <div class="stat">
            <div class="stat-icon">🔥</div>
            <div>
                <div class="stat-val" id="s-streak" style="color: var(--amber)">0</div>
                <div class="stat-lbl">Seri</div>
            </div>
        </div>
        <div class="stat">
            <div class="stat-icon">📊</div>
            <div>
                <div class="stat-val" id="s-acc">—</div>
                <div class="stat-lbl">Başarı</div>
            </div>
        </div>
    </div>

    <!-- LAYOUT -->
    <div class="layout">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-head">⏰ 12 Zaman</div>
            <div id="tense-list"></div>
        </div>

        <!-- PANEL -->
        <div class="panel">
            <div id="lesson"></div>
        </div>

    </div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════
const TENSES = [
    {
        id: 0, name: 'Simple Present', code: 'V / V+s',
        turkish: 'Basit Şimdiki Zaman',
        rule: 'Günlük tekrarlanan eylemler, değişmeyen gerçekler ve alışkanlıklar için kullanılır.',
        formula: [
            { label: 'Olumlu', text: 'I/You/We/They + V\nHe/She/It + V+s' },
            { label: 'Olumsuz', text: 'do/does + not + V' },
            { label: 'Soru', text: 'Do/Does + subject + V?' }
        ],
        timelineType: 'simple-present',
        signals: ['always', 'usually', 'often', 'every day', 'never'],
        examples: [
            { en: 'I eat breakfast every day.', tr: 'Her gün kahvaltı yerim.' },
            { en: 'She works as a teacher.', tr: 'O öğretmen olarak çalışır.' },
            { en: 'They play football on Sundays.', tr: 'Pazarları futbol oynarlar.' }
        ],
        commonMistakes: [
            { wrong: 'She go to school', right: 'She goes to school', explanation: 'He/She/It ile fiile -s/-es eklenir' },
            { wrong: 'I does not sleep', right: 'I do not sleep', explanation: 'I/You/We/They ile "do not" kullanılır' }
        ]
    },
    {
        id: 1, name: 'Present Continuous', code: 'am/is/are + V-ing',
        turkish: 'Şu Anki Devamlı Zaman',
        rule: 'Şu anda devam eden eylemler veya yakın gelecekte planlananlar için kullanılır.',
        formula: [
            { label: 'Olumlu', text: 'am/is/are + V-ing' },
            { label: 'Olumsuz', text: 'am/is/are + not + V-ing' },
            { label: 'Soru', text: 'Is/Are + subject + V-ing?' }
        ],
        timelineType: 'present-continuous',
        signals: ['now', 'at the moment', 'currently', 'right now', 'today'],
        examples: [
            { en: 'I am reading a book right now.', tr: 'Şu anda bir kitap okuyorum.' },
            { en: 'She is studying for her exam.', tr: 'Sınavı için çalışıyor.' },
            { en: 'They are playing football.', tr: 'Futbol oynuyorlar.' }
        ],
        commonMistakes: [
            { wrong: 'I am read', right: 'I am reading', explanation: '"be" den sonra mutlaka V-ing gelir' },
            { wrong: 'She is studys', right: 'She is studying', explanation: 'study → studying (-y ler özel kural)' }
        ]
    },
    {
        id: 2, name: 'Simple Past', code: 'V-ed / irregular',
        turkish: 'Geçmiş Zaman',
        rule: 'Geçmişte belirli bir anda tamamlanmış eylemler için kullanılır.',
        formula: [
            { label: 'Olumlu', text: 'V-ed (düzenli)\nirregular V2 (düzensiz)' },
            { label: 'Olumsuz', text: 'did + not + V' },
            { label: 'Soru', text: 'Did + subject + V?' }
        ],
        timelineType: 'simple-past',
        signals: ['yesterday', 'last week', 'ago', 'in 1999', 'last night'],
        examples: [
            { en: 'I watched a movie yesterday.', tr: 'Dün bir film izledim.' },
            { en: 'She went to London last year.', tr: 'Geçen yıl Londra\'ya gitti.' },

// CLAUDE API
// ══════════════════════════════════════════════
async function callClaude(systemPrompt, userMessage) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: systemPrompt,
            messages: [{ role: 'user', content: userMessage }]
        })
    });
    const data = await res.json();
    return data.content?.[0]?.text || 'Bir hata oluştu.';
}

function init() {
    const list = document.getElementById('tense-list');
    TENSES.forEach((t, i) => {

        btn.className = `tense-btn ${i === 0 ? 'active' : ''}`;

function switchTense(i) {
    currentId = i;
    document.querySelectorAll('.tense-btn').forEach((b, j) => b.classList.toggle('active', j === i));

}

function toggleColl(head) {
    const arrow = head.querySelector('.coll-arrow');
    const body = head.nextElementSibling;
    arrow.classList.toggle('open');
    body.classList.toggle('open');
}

function switchTab(btn, id) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById(id).classList.add('active');
}

async function doExample(idx) {
    const input = document.getElementById('ex-input').value.trim();
    if (!input) { alert('Lütfen Türkçe bir cümle yazın!'); return; }

    const t = TENSES[idx];
    const load = document.getElementById('load-ex');
    const fb = document.getElementById('fb-ex');

    load.classList.add('show');
    fb.classList.remove('show');

    try {
        const system = `Sen bir İngilizce gramer öğretmenisin. Kullanıcı sana Türkçe bir cümle verecek.
Senin görevin: Bu cümleyi TAM OLARAK "${t.name}" (${t.code}) zaman yapısını kullanarak İngilizceye çevirmek ve kısa açıklamak.
Format: 
🇬🇧 [İngilizce cümle]
📌 Yapı: [kullanılan formula]
💡 Neden: [1-2 cümle açıklama, Türkçe]
Kısa ve öğretici ol.`;

        const result = await callClaude(system, `Türkçe cümle: "${input}"`);

        fb.className = 'feedback ok show';
        fb.innerHTML = `<div class="fb-head">⚡ Claude AI Analizi</div><div class="fb-body">${result.replace(/\n/g, '<br>')}</div>`;
    } catch (e) {
        fb.className = 'feedback err show';
        fb.innerHTML = `<div class="fb-head">Hata</div><div class="fb-body">API bağlantısı kurulamadı.</div>`;
    } finally {
        load.classList.remove('show');
    }
}

async function generateIdentify(idx) {
    if (!identifyLang) { alert('Lütfen bir dil seçin!'); return; }

    const load = document.getElementById('load-id1');
    const fb = document.getElementById('fb-id1');
    load.classList.add('show');
    fb.classList.remove('show');

    const langLabel = identifyLang === 'en' ? 'English' : 'Turkish';
    const randomTense = TENSES[Math.floor(Math.random() * TENSES.length)];

    try {
        const system = `You are an English grammar teacher. Generate ONE simple example sentence in ${langLabel} using the "${randomTense.name}" tense. Return ONLY the sentence, nothing else. No quotes, no explanation, just the sentence.`;
        const sentence = await callClaude(system, 'Generate the sentence.');

        identifySentence = { sentence: sentence.trim(), tenseName: randomTense.name };

        document.getElementById('id-sentence').textContent = sentence.trim();
        document.getElementById('identify-s1').style.display = 'none';
        document.getElementById('identify-s2').style.display = 'block';
    } catch (e) {
        fb.className = 'feedback err show';
        fb.innerHTML = `<div class="fb-head">Hata</div><div class="fb-body">API bağlantısı kurulamadı.</div>`;
    } finally {
        load.classList.remove('show');
    }
}

Doğru zaman: ${identifySentence.tenseName}
Öğrencinin cevabı: "${answer}"

Öğrenci doğru mu yanlış mı? 
Format:
SONUÇ: [DOĞRU veya YANLIŞ]
AÇIKLAMA: [Türkçe, 1-2 cümle, nedenini açıkla]`;

        const result = await callClaude(system, 'Değerlendir.');
        const isCorrect = result.toUpperCase().includes('DOĞRU') || result.toUpperCase().includes('CORRECT');

        if (isCorrect) {
            stats.correct++; stats.streak++;
            fb.className = 'feedback ok show';
        } else {
            stats.wrong++; stats.streak = 0;
            fb.className = 'feedback err show';
        }
        stats.total++;
        updateStats();

        fb.innerHTML = `<div class="fb-head">${isCorrect ? '🎉 Harika!' : '❌ Tekrar Dene'}</div><div class="fb-body">${result.replace(/\n/g, '<br>')}</div>`;
    } catch (e) {
        fb.className = 'feedback err show';
        fb.innerHTML = `<div class="fb-head">Hata</div><div class="fb-body">API bağlantısı kurulamadı.</div>`;
    } finally {
        load.classList.remove('show');
    }
}

function resetIdentify() {
    identifyLang = null;
    identifySentence = null;
    document.getElementById('identify-s1').style.display = 'block';
    document.getElementById('identify-s2').style.display = 'none';
    document.getElementById('id-answer').value = '';
    document.querySelectorAll('.choice').forEach(b => b.classList.remove('selected'));
    document.getElementById('fb-id1').classList.remove('show');
    document.getElementById('fb-id2').classList.remove('show');
}

// ══════════════════════════════════════════════
// TAB 3 — TRANSLATE + AI CHECK
// ══════════════════════════════════════════════
function pickBuildSentence(idx) {
    const t = TENSES[idx];
    buildSentence = t.examples[Math.floor(Math.random() * t.examples.length)];
    const el = document.getElementById('tr-sentence');
    if (el) el.textContent = buildSentence.tr;
}

function newSentence(idx) {
    const t = TENSES[idx];
    const prev = buildSentence;
    do {
        buildSentence = t.examples[Math.floor(Math.random() * t.examples.length)];
    } while (buildSentence === prev && t.examples.length > 1);
    document.getElementById('tr-sentence').textContent = buildSentence.tr;
    document.getElementById('tr-answer').value = '';
    document.getElementById('fb-tr').classList.remove('show');
}

async function checkTranslate(idx) {
    const answer = document.getElementById('tr-answer').value.trim();
    if (!answer) { alert('Lütfen cevabınızı yazın!'); return; }

    const t = TENSES[idx];
    const load = document.getElementById('load-tr');
    const fb = document.getElementById('fb-tr');
    load.classList.add('show');
    fb.classList.remove('show');

    try {
        const system = `Sen profesyonel bir İngilizce gramer öğretmenisin. Strict ve eğitici değerlendirme yaparsın.

Görev: Öğrencinin cümlesini analiz et.
Türkçe orijinal: "${buildSentence.tr}"
Beklenen zaman: ${t.name} (${t.code})
Doğru cevap: "${buildSentence.en}"
Öğrencinin cevabı: "${answer}"

Değerlendirme formatı (Türkçe):
✅ SONUÇ: [DOĞRU / KISMI DOĞRU / YANLIŞ]
📝 DOĞRU CEVAP: [cümle]
🔍 ANALİZ: [Öğrencinin hataları varsa spesifik olarak belirt: hangi kelime/yapı yanlış ve neden. Doğruysa ne iyi yaptığını söyle.]
💡 KURAL HATIRLATMA: [${t.name} için 1 kritik kural]`;

        const result = await callClaude(system, 'Değerlendir.');

        const upper = result.toUpperCase();
        const isCorrect = upper.includes('DOĞRU') && !upper.includes('YANLIŞ') && !upper.includes('KISMİ');
        const isPartial = upper.includes('KISMİ');

        if (isCorrect) {
            stats.correct++; stats.streak++;
            fb.className = 'feedback ok show';
        } else {
            stats.wrong++; stats.streak = 0;
            fb.className = 'feedback err show';
        }
        stats.total++;
        updateStats();

        fb.innerHTML = `
            <div class="fb-head">${isCorrect ? '🏆 Mükemmel!' : isPartial ? '🤔 Yakın!' : '❌ Düzeltme Gerekli'}</div>
            <div class="fb-body">${result.replace(/\n/g, '<br>')}</div>
        `;
    } catch (e) {
        fb.className = 'feedback err show';
        fb.innerHTML = `<div class="fb-head">Hata</div><div class="fb-body">API bağlantısı kurulamadı.</div>`;
    } finally {
        load.classList.remove('show');
    }
}

// ══════════════════════════════════════════════
// STATS
// ══════════════════════════════════════════════
function updateStats() {
    document.getElementById('s-correct').textContent = stats.correct;
    document.getElementById('s-wrong').textContent = stats.wrong;
    document.getElementById('s-streak').textContent = stats.streak;
    const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) + '%' : '—';
    document.getElementById('s-acc').textContent = acc;
}

// ══════════════════════════════════════════════
// SVG TIMELINES
// ══════════════════════════════════════════════
function createSVG(type) {
    const w = 500, h = 120, cy = 65;
    let inner = '';

    // Base line
    inner += `<line x1="20" y1="${cy}" x2="480" y2="${cy}" stroke="#1e2d3d" stroke-width="2"/>`;

    // Arrow ends
    inner += `<polygon points="480,${cy-5} 490,${cy} 480,${cy+5}" fill="#1e2d3d"/>`;

    // Labels
    inner += `<text x="30" y="${cy+30}" font-size="10" fill="#475569" font-family="JetBrains Mono">PAST</text>`;
    inner += `<text x="225" y="${cy+30}" font-size="10" fill="#3b82f6" font-family="JetBrains Mono" text-anchor="middle">NOW</text>`;
    inner += `<text x="455" y="${cy+30}" font-size="10" fill="#475569" font-family="JetBrains Mono" text-anchor="end">FUTURE</text>`;

    // Now marker
    inner += `<line x1="250" y1="${cy-14}" x2="250" y2="${cy+14}" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>`;

    if (type === 'simple-present') {
        for (let j = 0; j < 5; j++) {
            const x = 220 + j * 20;
            inner += `<circle cx="${x}" cy="${cy}" r="4" fill="#3b82f6"/>`;
            inner += `<line x1="${x}" y1="${cy-12}" x2="${x}" y2="${cy-4}" stroke="#3b82f6" stroke-width="1.5"/>`;
        }
    } else if (type === 'present-continuous') {
        inner += `<path d="M210,${cy} L290,${cy}" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>`;
        inner += `<polygon points="288,${cy-5} 298,${cy} 288,${cy+5}" fill="#06b6d4"/>`;
        inner += `<circle cx="210" cy="${cy}" r="5" fill="none" stroke="#06b6d4" stroke-width="2"/>`;
    } else if (type === 'simple-past') {
        inner += `<circle cx="80" cy="${cy}" r="6" fill="#f43f5e"/>`;
        inner += `<line x1="80" y1="${cy-15}" x2="80" y2="${cy-7}" stroke="#f43f5e" stroke-width="1.5"/>`;
        inner += `<text x="80" y="${cy-20}" font-size="9" fill="#f43f5e" text-anchor="middle" font-family="JetBrains Mono">✓</text>`;
    } else if (type === 'past-continuous') {
        inner += `<path d="M50,${cy} L150,${cy}" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>`;
        inner += `<circle cx="50" cy="${cy}" r="4" fill="none" stroke="#f59e0b" stroke-width="2"/>`;
        inner += `<circle cx="150" cy="${cy}" r="4" fill="none" stroke="#f59e0b" stroke-width="2"/>`;
        inner += `<text x="100" y="${cy-15}" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="JetBrains Mono">ONGOING</text>`;
    } else if (type === 'present-perfect') {
        inner += `<path d="M100,${cy} Q175,${cy-25} 250,${cy}" stroke="#10b981" stroke-width="2.5" fill="none"/>`;
        inner += `<circle cx="100" cy="${cy}" r="5" fill="#10b981"/>`;
        inner += `<polygon points="248,${cy-5} 258,${cy} 248,${cy+5}" fill="#10b981"/>`;
    } else if (type === 'present-perfect-continuous') {
        inner += `<path d="M60,${cy} L250,${cy}" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>`;
        inner += `<circle cx="60" cy="${cy}" r="5" fill="#10b981"/>`;
        inner += `<polygon points="248,${cy-5} 258,${cy} 248,${cy+5}" fill="#10b981"/>`;
        inner += `<text x="155" y="${cy-15}" font-size="9" fill="#10b981" text-anchor="middle" font-family="JetBrains Mono">←duration→</text>`;
    } else if (type === 'simple-future') {
        for (let j = 0; j < 3; j++) {
            const x = 310 + j * 60;
            inner += `<circle cx="${x}" cy="${cy}" r="4" fill="#6366f1"/>`;
            inner += `<line x1="${x}" y1="${cy-12}" x2="${x}" y2="${cy-4}" stroke="#6366f1" stroke-width="1.5"/>`;
        }
    } else if (type === 'future-continuous') {
        inner += `<path d="M300,${cy} L420,${cy}" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>`;
        inner += `<circle cx="300" cy="${cy}" r="4" fill="none" stroke="#a855f7" stroke-width="2"/>`;
        inner += `<polygon points="418,${cy-5} 428,${cy} 418,${cy+5}" fill="#a855f7"/>`;
    } else if (type === 'past-perfect') {
        inner += `<circle cx="60" cy="${cy}" r="5" fill="#f59e0b"/>`;
        inner += `<line x1="60" y1="${cy}" x2="120" y2="${cy}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>`;
        inner += `<circle cx="120" cy="${cy}" r="5" fill="#f43f5e"/>`;
        inner += `<text x="60" y="${cy-15}" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="JetBrains Mono">1st</text>`;
        inner += `<text x="120" y="${cy-15}" font-size="9" fill="#f43f5e" text-anchor="middle" font-family="JetBrains Mono">2nd</text>`;
    } else if (type === 'past-perfect-continuous') {
        inner += `<path d="M30,${cy} L120,${cy}" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>`;
        inner += `<circle cx="30" cy="${cy}" r="4" fill="#f59e0b"/>`;
        inner += `<circle cx="120" cy="${cy}" r="5" fill="#f43f5e"/>`;
        inner += `<text x="75" y="${cy-15}" font-size="9" fill="#f59e0b" text-anchor="middle" font-family="JetBrains Mono">duration</text>`;
    } else if (type === 'future-perfect') {
        inner += `<circle cx="250" cy="${cy}" r="4" fill="#06b6d4"/>`;
        inner += `<line x1="250" y1="${cy}" x2="380" y2="${cy}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>`;
        inner += `<circle cx="380" cy="${cy}" r="5" fill="#10b981"/>`;
        inner += `<text x="380" y="${cy-15}" font-size="9" fill="#10b981" text-anchor="middle" font-family="JetBrains Mono">by then ✓</text>`;
    } else if (type === 'future-perfect-continuous') {
        inner += `<path d="M250,${cy} L390,${cy}" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>`;
        inner += `<circle cx="250" cy="${cy}" r="4" fill="#06b6d4"/>`;
        inner += `<circle cx="390" cy="${cy}" r="5" fill="#10b981"/>`;
        inner += `<text x="320" y="${cy-15}" font-size="9" fill="#10b981" text-anchor="middle" font-family="JetBrains Mono">←duration→</text>`;
    }

    return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:${h}px;">${inner}</svg>`;
}

init();
</script>
