<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaCheck - English Grammar Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink: #0d1117; --ink2: #1c2333; --blue: #3b82f6; --blue-dim: #1d4ed8;
            --cyan: #06b6d4; --emerald: #10b981; --amber: #f59e0b; --rose: #f43f5e;
            --border: #1e2d3d; --surface: #161b27; --surface2: #1a2236;
            --text: #e2e8f0; --text2: #94a3b8;
        }
        body { font-family: 'Syne', sans-serif; background: var(--ink); color: var(--text); min-height: 100vh; }
        body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
        .wrap { position: relative; z-index: 1; max-width: 1380px; margin: 0 auto; padding: 24px 20px; }
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--blue), var(--cyan)); border-radius: 12px; display: grid; place-items: center; font-size: 22px; }
        .brand-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .brand-sub { font-size: 11px; color: var(--text2); text-transform: uppercase; }
        .ai-badge { display: flex; align-items: center; gap: 7px; padding: 6px 14px; background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(6,182,212,0.15)); border: 1px solid rgba(59,130,246,0.3); border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--cyan); }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
        .stat-val { font-size: 28px; font-weight: 800; color: var(--blue); }
        .stat-lbl { font-size: 10px; color: var(--text2); text-transform: uppercase; }
        .layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
        .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; height: fit-content; position: sticky; top: 20px; }
        .sidebar-head { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text2); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .tense-btn { display: block; width: 100%; text-align: left; padding: 9px 12px; background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer; margin-bottom: 4px; color: var(--text2); font-family: 'Syne', sans-serif; font-size: 12px; transition: all 0.2s; }
        .tense-btn:hover { background: var(--surface2); color: var(--text); }
        .tense-btn.active { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(6,182,212,0.1)); border-color: rgba(59,130,246,0.4); color: var(--blue); }
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
        .tense-name-big { font-size: 38px; font-weight: 800; background: linear-gradient(135deg, #e2e8f0, var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .practice-wrap { margin-top: 28px; background: var(--ink2); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .practice-head { padding: 18px 24px; background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(244,63,94,0.08)); border-bottom: 1px solid var(--border); }
        .ph-title { font-size: 14px; font-weight: 800; color: var(--amber); margin-bottom: 3px; }
        .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--ink); }
        .tab { padding: 13px 20px; background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; transition: all 0.2s; }
        .tab:hover { color: var(--amber); }
        .tab.active { color: var(--amber); border-bottom-color: var(--amber); }
        .tab-panel { display: none; padding: 24px; }
        .tab-panel.active { display: block; }
        textarea, input[type="text"] { width: 100%; padding: 12px 14px; background: var(--ink); border: 1px solid var(--border); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); min-height: 60px; }
        textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .btn-row { display: flex; gap: 10px; margin-top: 14px; }
        .btn-ai { flex: 1; padding: 11px 18px; background: linear-gradient(135deg, var(--blue), var(--blue-dim)); color: white; border: none; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .btn-ai:hover { filter: brightness(1.12); }
        .btn-sec { padding: 11px 16px; background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .btn-sec:hover { border-color: var(--text2); color: var(--text); }
        .ai-loading { display: none; padding: 20px; text-align: center; color: var(--text2); }
        .ai-loading.show { display: block; }
        .feedback { display: none; margin-top: 16px; border-radius: 10px; padding: 18px; }
        .feedback.show { display: block; }
        .feedback.ok { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.3); }
        .feedback.err { background: rgba(244,63,94,0.08); border: 1px solid rgba(244,63,94,0.3); }
        .fb-head { font-size: 12px; font-weight: 800; margin-bottom: 10px; }
        .feedback.ok .fb-head { color: var(--emerald); }
        .feedback.err .fb-head { color: var(--rose); }
        .fb-body { font-size: 12px; line-height: 1.8; color: var(--text2); }
        @media (max-width: 1024px) { .layout { grid-template-columns: 1fr; } .sidebar { position: static; } }
        @media (max-width: 640px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="brand">
            <div class="brand-icon">🎓</div>
            <div>
                <div class="brand-name">Grammar Academy</div>
                <div class="brand-sub">12 Tenses · AI Powered</div>
            </div>
        </div>
        <div class="ai-badge">✓ Groq AI Aktif</div>
    </header>

    <div class="stats-row">
        <div class="stat"><div><div class="stat-val" id="s-correct">0</div><div class="stat-lbl">Doğru</div></div></div>
        <div class="stat"><div><div class="stat-val" id="s-wrong" style="color: var(--rose)">0</div><div class="stat-lbl">Yanlış</div></div></div>
        <div class="stat"><div><div class="stat-val" id="s-streak" style="color: var(--amber)">0</div><div class="stat-lbl">Seri</div></div></div>
        <div class="stat"><div><div class="stat-val" id="s-acc">—</div><div class="stat-lbl">Başarı</div></div></div>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-head">⏰ 12 Zaman</div>
            <div id="tense-list"></div>
        </div>

        <div class="panel" id="lesson"></div>
    </div>
</div>

<script>
const GROQ_API_KEY = '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';

const TENSES = [
    { id: 0, name: 'Simple Present', code: 'V / V+s', turkish: 'Basit Şimdiki Zaman', rule: 'Günlük tekrarlanan eylemler, değişmeyen gerçekler ve alışkanlıklar' },
    { id: 1, name: 'Present Continuous', code: 'am/is/are + V-ing', turkish: 'Şu Anki Devamlı Zaman', rule: 'Şu anda devam eden eylemler' },
    { id: 2, name: 'Simple Past', code: 'V-ed / irregular', turkish: 'Geçmiş Zaman', rule: 'Geçmişte tamamlanmış eylemler' },
    { id: 3, name: 'Past Continuous', code: 'was/were + V-ing', turkish: 'Geçmiş Devamlı Zaman', rule: 'Geçmişte belirli bir anda devam eden eylemler' },
    { id: 4, name: 'Present Perfect', code: 'have/has + PP', turkish: 'Şimdiki Zaman Tamamlanmışı', rule: 'Yakın geçmişte tamamlanmış eylemler' },
    { id: 5, name: 'Present Perfect Continuous', code: 'have/has + been + V-ing', turkish: 'Şimdiki Devamlı Tamamlanmışı', rule: 'Geçmişten başlayıp şu an devam eden eylemler' },
    { id: 6, name: 'Simple Future', code: 'will + V', turkish: 'Gelecek Zaman', rule: 'Gelecekte yapılacak eylemler' },
    { id: 7, name: 'Future Continuous', code: 'will + be + V-ing', turkish: 'Gelecek Devamlı Zaman', rule: 'Gelecekte belirli bir anda devam ediyor olacak eylemler' },
    { id: 8, name: 'Past Perfect', code: 'had + PP', turkish: 'Geçmiş Zamanın Geçmişi', rule: 'Geçmişte gerçekleşen iki olaydan önce tamamlanmış olanı' },
    { id: 9, name: 'Past Perfect Continuous', code: 'had + been + V-ing', turkish: 'Geçmiş Devamlı Tamamlanmışı', rule: 'Geçmişte bir olaydan önce belirli bir süre devam eden eylemler' },
    { id: 10, name: 'Future Perfect', code: 'will + have + PP', turkish: 'Gelecek Tamamlanmışı', rule: 'Gelecekte belirli bir zamana kadar tamamlanmış olacak eylemler' },
    { id: 11, name: 'Future Perfect Continuous', code: 'will + have + been + V-ing', turkish: 'Gelecek Devamlı Tamamlanmışı', rule: 'Gelecekte belirli bir süre devam ediyor olacak eylemler' }
];

async function callGroqAPI(userText) {
    const loadingEl = document.querySelector('.ai-loading');
    const feedbackEl = document.querySelector('.feedback');
    
    if (loadingEl) loadingEl.classList.add('show');
    if (feedbackEl) feedbackEl.classList.remove('show');

    try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${GROQ_API_KEY}`,
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                model: 'mixtral-8x7b-32768',
                messages: [{ role: 'user', content: `Analyze this English sentence: "${userText}". Is it correct? If not, provide the correct version. Respond in Turkish briefly.` }],
                temperature: 0.5,
                max_tokens: 300
            })
        });

        if (!response.ok) throw new Error('API Error');

        const data = await response.json();
        const aiResponse = data.choices[0].message.content;
        const isCorrect = aiResponse.toLowerCase().includes('doğru') || aiResponse.toLowerCase().includes('correct');
        
        document.getElementById('s-correct').textContent = parseInt(document.getElementById('s-correct').textContent) + (isCorrect ? 1 : 0);
        document.getElementById('s-wrong').textContent = parseInt(document.getElementById('s-wrong').textContent) + (isCorrect ? 0 : 1);

        if (feedbackEl) {
            feedbackEl.classList.add('show', isCorrect ? 'ok' : 'err');
            feedbackEl.innerHTML = `<div class="fb-head">${isCorrect ? '✅ Doğru!' : '❌ Yanlış'}</div><div class="fb-body">${aiResponse}</div>`;
        }
    } catch (error) {
        if (feedbackEl) {
            feedbackEl.classList.add('show', 'err');
            feedbackEl.innerHTML = `<div class="fb-head">���️ Hata</div><div class="fb-body">${error.message}</div>`;
        }
    }
    if (loadingEl) loadingEl.classList.remove('show');
}

function renderLesson(tenseId) {
    const tense = TENSES[tenseId];
    const lessonEl = document.getElementById('lesson');
    
    lessonEl.innerHTML = `
        <div class="tense-name-big">${tense.name}</div>
        <div class="tense-tr">${tense.turkish}</div>
        <p>${tense.rule}</p>

        <div class="practice-wrap">
            <div class="practice-head">
                <div class="ph-title">🎯 UYGULAMA — AI DESTEKLİ</div>
            </div>

            <div class="tab-bar">
                <button class="tab active" data-tab="0">1 - Cümle Kontrol</button>
                <button class="tab" data-tab="1">2 - Seçim Yap</button>
                <button class="tab" data-tab="2">3 - Boşluk Doldur</button>
            </div>

            <div class="ai-loading">AI Analiz Ediliyor...</div>

            <div class="tab-panel active">
                <label>Cümle Yaz:</label><br><br>
                <textarea placeholder="Örn: She go to school..."></textarea>
                <div class="btn-row">
                    <button class="btn-ai">⚡ AI Kontrol Et</button>
                    <button class="btn-sec">Temizle</button>
                </div>
                <div class="feedback"></div>
            </div>

            <div class="tab-panel">
                <h3>Doğru Cümleyi Seç:</h3>
                <button style="width:100%; padding:10px; margin:5px 0; cursor:pointer; border: 1px solid var(--border); border-radius: 8px; background: var(--ink); color: var(--text); font-family: 'Syne';">Option A</button>
                <button style="width:100%; padding:10px; margin:5px 0; cursor:pointer; border: 1px solid var(--border); border-radius: 8px; background: var(--ink); color: var(--text); font-family: 'Syne';">Option B ✓</button>
                <div class="feedback"></div>
            </div>

            <div class="tab-panel">
                <label>Boşlukları Doldur:</label><br><br>
                <textarea placeholder="She ___ (go) to school every day"></textarea>
                <div class="btn-row">
                    <button class="btn-ai">⚡ Kontrol Et</button>
                    <button class="btn-sec">Temizle</button>
                </div>
                <div class="feedback"></div>
            </div>
        </div>
    `;
    
    setTimeout(() => {
        document.querySelectorAll('.tab').forEach((tab, idx) => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-panel')[idx].classList.add('active');
            });
        });

        document.querySelectorAll('.btn-ai').forEach(btn => {
            btn.addEventListener('click', () => {
                const textarea = btn.closest('.tab-panel').querySelector('textarea');
                if (textarea && textarea.value.trim()) callGroqAPI(textarea.value);
            });
        });

        document.querySelectorAll('.btn-sec').forEach(btn => {
            btn.addEventListener('click', () => {
                const textarea = btn.closest('.tab-panel').querySelector('textarea');
                if (textarea) textarea.value = '';
            });
        });
    }, 0);
}

window.addEventListener('load', function() {
    renderLesson(0);
    
    const tenseListEl = document.getElementById('tense-list');
    TENSES.forEach((tense, idx) => {
        const btn = document.createElement('button');
        btn.className = 'tense-btn' + (idx === 0 ? ' active' : '');
        btn.textContent = tense.name;
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tense-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLesson(idx);
        });
        tenseListEl.appendChild(btn);
    });
});
</script>
</body>
</html>
